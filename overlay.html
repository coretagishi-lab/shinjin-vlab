<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vぶい 演出画面</title>
<style>
/* OBSのブラウザソース用。背景は透明。ふだんは何も表示しない（配信画面のレイアウトには一切さわらない） */
html,body{margin:0;background:transparent;overflow:hidden;width:100vw;height:100vh;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
/* 1920×1080 を基準に作って、OBSの画面サイズに合わせて縮める（720pでも1080pでも同じ見え方） */
html{-webkit-text-size-adjust:none;text-size-adjust:none}
#root{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
#stack{position:absolute;width:560px;display:flex;flex-direction:column;gap:10px}
#stack.bl{left:32px;bottom:32px;transform-origin:0 100%}
#stack.br{right:32px;bottom:32px;transform-origin:100% 100%;align-items:flex-end}
#stack.tl{left:32px;top:32px;transform-origin:0 0;flex-direction:column-reverse;justify-content:flex-end}
#stack.tr{right:32px;top:32px;transform-origin:100% 0;align-items:flex-end;flex-direction:column-reverse;justify-content:flex-end}
.cm{display:flex;gap:12px;align-items:flex-start;background:rgba(20,16,32,.82);color:#fff;border:2px solid #ff7ab8;border-radius:18px;padding:12px 16px;font-size:26px;line-height:1.45;box-shadow:0 6px 18px rgba(0,0,0,.35);animation:in .35s cubic-bezier(.2,.9,.3,1.2) both;max-width:100%;box-sizing:border-box;word-break:break-word}
#stack.br .cm,#stack.tr .cm{animation-name:inr}
.cm.out{animation:out .5s ease both}
.cm.pv{border-style:dashed;background:rgba(20,16,32,.6)}
.cm.hr{border-color:#ffc24a}
.cm img,.cm .av{width:44px;height:44px;border-radius:50%;flex:none;object-fit:cover;background:#2b2340;display:grid;place-items:center;font-weight:700;color:#ffc24a}
.cm b{display:block;font-size:18px;color:#ffb3d6}
.cm b i{font-style:normal;font-size:14px;background:#ff5fa8;color:#fff;border-radius:6px;padding:0 6px;margin-left:8px}
#fx{position:absolute;inset:0;display:grid;place-items:center}
.banner{background:linear-gradient(90deg,#ff5fa8,#3fb8f5);color:#fff;font-weight:900;font-size:64px;padding:26px 56px;border-radius:28px;box-shadow:0 10px 40px rgba(0,0,0,.4);text-align:center;animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}
.banner small{display:block;font-size:28px;font-weight:700;margin-top:6px;opacity:.95}
.banner.out{animation:out .6s ease both}
@keyframes in{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes inr{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateY(10px)}}
#err{position:absolute;left:24px;top:24px;background:#e5333d;color:#fff;font-size:22px;font-weight:700;border-radius:12px;padding:10px 16px;display:none}

/* ---- ギフトの演出（小：画面のすみ／中：やや大きく／大：全画面） ---- */
#groot{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
#gfx{position:absolute;inset:0;overflow:hidden}
#gfx canvas{position:absolute;inset:0;width:100%;height:100%}
.gvid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.gvid canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.cm.gf b i{background:#ff5fa8}
#gchips{position:absolute;right:40px;bottom:200px;display:flex;flex-direction:column-reverse;align-items:flex-end;gap:14px}
#gtop{position:absolute;inset:0}
#labw{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:#0b0a12;pointer-events:auto}
#labw .lf{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#labw iframe{border:0;display:block;width:min(100vw,calc((100dvh - 96px) * 16 / 9));aspect-ratio:16/9;max-height:calc(100dvh - 96px)}
#lab{flex:none;display:flex;gap:6px;overflow-x:auto;padding:8px;background:rgba(10,8,18,.85);pointer-events:auto}
#lab button{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;border-radius:10px;background:#2a2238;color:#fff;font-size:22px;padding:6px 10px;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#lab small{font-size:10px}
#lab img{width:40px;height:24px;object-fit:contain}
.gchip.boom{animation:gboom .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes gboom{0%{transform:scale(1)}35%{transform:scale(1.45)}100%{transform:scale(1)}}
/* ---- ランダムギフト（チンチロ・ルーレット）の結果の帯 ---- */
.grb{position:absolute;left:0;right:0;top:13%;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:#fff;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both;white-space:nowrap}
.grb b{font-size:96px;font-weight:900;letter-spacing:.04em;-webkit-text-stroke:6px #2a1838;paint-order:stroke fill;text-shadow:0 8px 0 rgba(0,0,0,.35)}
.grb small{font-size:30px;font-weight:800;background:rgba(20,16,32,.78);border-radius:999px;padding:6px 22px}
.grb em{font-style:normal;color:#ffd25e}
.grb.big b{font-size:132px;color:#ffe27a;-webkit-text-stroke:8px #7a1f22;animation:grbig .9s ease-in-out infinite alternate}
.grb.sub{top:6%}
.grb.super b{font-size:150px;color:#fff3a0;-webkit-text-stroke:9px #b3232a}
.gcv3{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.grb.mini{top:auto;bottom:10%}.grb.mini b{font-size:56px}
@keyframes grbig{from{transform:scale(1)}to{transform:scale(1.08)}}
/* ---- 覗き演出：画面の右下から小さく（画面幅の15%くらい） ---- */
.gpeek{position:absolute;right:2%;bottom:0;width:15%;aspect-ratio:1/1;animation:gpk .9s cubic-bezier(.2,1.3,.4,1) both}
.gpeek.vid .gvid{position:absolute;inset:0}
.gpeek.ph .pk{position:absolute;left:10%;right:10%;bottom:-12%;height:80%;background:#ffd9ec;border:6px solid #2a1838;border-radius:50% 50% 30% 30%}
.gpeek .ear{position:absolute;top:-14%;width:26%;height:30%;background:#ffd9ec;border:6px solid #2a1838;border-bottom:0;border-radius:60% 60% 0 0}
.gpeek .ear.l{left:8%;transform:rotate(-18deg)}.gpeek .ear.r{right:8%;transform:rotate(18deg)}
.gpeek .face{position:absolute;left:0;right:0;top:26%;display:flex;justify-content:center;gap:22%}
.gpeek .face i{width:12%;aspect-ratio:1;background:#2a1838;border-radius:50%;animation:gpkeye 2.2s infinite}
.gpeek .face b{position:absolute;top:120%;width:10%;height:6px;background:#2a1838;border-radius:4px}
.gpeek .pk em{position:absolute;right:92%;top:-30%;font-style:normal;font-weight:900;font-size:26px;color:#2a1838;background:#fff;border:4px solid #2a1838;border-radius:18px;padding:4px 12px;white-space:nowrap}
@keyframes gpk{from{transform:translateY(100%)}to{transform:none}}
@keyframes gpkeye{0%,90%,100%{transform:none}95%{transform:scaleY(.1)}}
/* 軽量モード（スマホの視聴画面）：重いぼかし・影を外す */
.lite .gb-beam,.lite .gb-shadow{filter:none}
.lite .gb-item img:not(.gold),.lite .gfloat,.lite .gms .gi,.lite .gphx b{filter:none}
.lite .gb-rays{-webkit-mask:none;mask:none;background:repeating-conic-gradient(rgba(255,230,150,.35) 0 7deg,transparent 7deg 18deg);width:900px;height:900px;margin-left:-450px;bottom:-80px;border-radius:50%}
.lite .gbox.charge .gb-body,.lite .gbox.gold.charge2 .gb-body{box-shadow:0 0 30px 8px rgba(255,220,120,.8)}
.lite .gb-beam,.lite .gb-halo,.lite .gring,.lite .gb-item .tw{display:none}
.lite .gflash{animation-duration:.4s}
.lite .gdim{background:rgba(0,0,0,.55)}
.lite .gchip.lv4,.lite .gchip.lv5,.lite .gchip.lv6,.lite .gchip.lv7,.lite .gchip.lv8,.lite .gchip.lv9{animation:none;background:rgba(25,15,40,.95);border:4px solid #ffd25e}
.lite .gbox-tx .g100{animation:none}
.gdim{position:absolute;inset:0;background:radial-gradient(circle at 50% 52%,rgba(40,20,60,.35),rgba(0,0,0,.72) 75%);animation:gfade .4s ease both}
.gbox{position:absolute;left:50%;top:56%;width:360px;height:300px;margin:-150px 0 0 -180px;animation:gbdrop .7s cubic-bezier(.3,1.6,.5,1) both}
.gbox.charge{animation:gbshake .14s linear infinite}
.gbox.open{animation:none}
.gb-shadow{position:absolute;left:20px;right:20px;bottom:-26px;height:30px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(10px)}
.gb-body{position:absolute;left:30px;right:30px;bottom:0;height:190px;border-radius:14px;background:linear-gradient(160deg,#ff8ec4 0%,#ff4f97 55%,#d9306f 100%);box-shadow:inset 0 -16px 0 rgba(0,0,0,.14),inset 0 10px 0 rgba(255,255,255,.18),0 18px 40px rgba(0,0,0,.4);transition:box-shadow .3s}
.gb-body i{position:absolute;left:50%;top:0;bottom:0;width:46px;margin-left:-23px;background:linear-gradient(90deg,#e8a800,#ffe9a8 45%,#ffd25e 60%,#e8a800)}
.gb-body em{position:absolute;left:14px;top:14px;width:40px;height:150px;border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0))}
.gbox.charge .gb-body{box-shadow:inset 0 -16px 0 rgba(0,0,0,.14),0 0 40px 10px rgba(255,220,120,.85),0 0 120px 30px rgba(255,200,80,.5)}
.gb-lid{position:absolute;left:12px;right:12px;bottom:180px;height:62px;border-radius:12px;background:linear-gradient(160deg,#ffa3cf,#ff5d9f 60%,#e63f82);box-shadow:0 8px 16px rgba(0,0,0,.25),inset 0 6px 0 rgba(255,255,255,.25);transform-origin:20% 100%;z-index:3}
.gb-lid i{position:absolute;left:50%;top:0;bottom:0;width:46px;margin-left:-23px;background:linear-gradient(90deg,#e8a800,#ffe9a8 45%,#ffd25e 60%,#e8a800)}
.gb-lid b{position:absolute;left:50%;top:-62px;width:130px;height:68px;margin-left:-65px;background:radial-gradient(ellipse at 25% 60%,#ffd25e 0 37%,#e8a800 38% 40%,transparent 41%),radial-gradient(ellipse at 75% 60%,#ffd25e 0 37%,#e8a800 38% 40%,transparent 41%),radial-gradient(circle at 50% 85%,#ffb000 0 14%,transparent 15%)}
.gbox.charge .gb-lid{box-shadow:0 0 30px 8px rgba(255,230,140,.9)}
.gbox.open .gb-lid{animation:gblid .9s cubic-bezier(.15,.8,.3,1) forwards}
.gb-item{position:absolute;left:50%;bottom:60px;width:460px;height:259px;margin-left:-230px;display:grid;place-items:center;opacity:0;transform:translateY(80px) scale(.2);z-index:2}
.gb-item img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 24px rgba(255,240,180,1)) drop-shadow(0 0 60px rgba(255,200,90,.8))}
.gb-item span{font-size:170px}
.gbox.open .gb-item{animation:gbitem 1s .1s cubic-bezier(.2,1.5,.4,1) forwards,gbbob 2.4s 1.2s ease-in-out infinite}
.gb-item .tw{position:absolute;font-style:normal;color:#fff6c8;text-shadow:0 0 12px #ffd25e,0 0 24px #ffb000;font-size:44px;opacity:0;animation:gtw 1.2s ease-in-out infinite}
.gb-item .tw:nth-of-type(1){left:2%;top:10%;animation-delay:1.1s}.gb-item .tw:nth-of-type(2){right:4%;top:4%;animation-delay:1.4s;font-size:34px}
.gb-item .tw:nth-of-type(3){left:12%;bottom:6%;animation-delay:1.7s;font-size:30px}.gb-item .tw:nth-of-type(4){right:10%;bottom:14%;animation-delay:1.3s}
.gb-item .tw:nth-of-type(5){left:46%;top:-14%;animation-delay:1.9s;font-size:36px}.gb-item .tw:nth-of-type(6){right:-4%;top:46%;animation-delay:1.6s;font-size:28px}
.gb-halo{position:absolute;left:50%;bottom:150px;width:520px;height:520px;margin-left:-260px;border-radius:50%;opacity:0;background:radial-gradient(circle,rgba(255,250,220,.95) 0,rgba(255,215,110,.55) 28%,rgba(255,150,60,0) 65%)}
.gbox.open .gb-halo{animation:gbhalo 4s .15s ease-out forwards}
.gb-rays{position:absolute;left:50%;bottom:-120px;width:1300px;height:1300px;margin-left:-650px;border-radius:50%;opacity:0;background:repeating-conic-gradient(rgba(255,230,150,.6) 0 7deg,transparent 7deg 18deg);-webkit-mask:radial-gradient(circle,#000 12%,transparent 62%);mask:radial-gradient(circle,#000 12%,transparent 62%)}
.gbox.open .gb-rays{animation:gbrays 4.4s linear forwards}
.gb-beam{position:absolute;left:50%;bottom:150px;width:220px;height:1200px;margin-left:-110px;transform-origin:50% 100%;opacity:0;background:linear-gradient(0deg,rgba(255,245,200,.9),rgba(255,220,130,.35) 50%,rgba(255,220,130,0));filter:blur(6px)}
.gbox.open .gb-beam{animation:gbbeam 1.6s ease-out forwards}
.gflash{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#fff 0,rgba(255,255,255,.85) 30%,rgba(255,240,200,0) 70%);animation:gflash .7s ease-out forwards;pointer-events:none}
.gring{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;border:10px solid rgba(255,230,150,.95);box-shadow:0 0 40px rgba(255,220,120,.9);animation:gring .9s ease-out forwards}
.gring.r2{border-color:rgba(255,140,200,.9);animation-delay:.15s;opacity:0}
.gbox-tx{position:absolute;left:0;right:0;top:calc(56% + 175px);display:flex;flex-direction:column;align-items:center;gap:2px;animation:gtxin .55s cubic-bezier(.2,1.6,.4,1) both;text-align:center}
.gbox-tx small{font-size:34px;font-weight:800;color:#fff;text-shadow:0 3px 10px rgba(0,0,0,.6)}
.gbox-tx small em{font-style:normal;color:#ffe27a}
.gbox-tx b{font-size:84px;font-weight:900;line-height:1.05;color:#fff6c8;-webkit-text-stroke:5px #c2185b;paint-order:stroke fill;text-shadow:0 0 30px rgba(255,200,80,.9);letter-spacing:.04em}
.gbox-tx span{font-size:38px;font-weight:900;color:#fff;background:linear-gradient(90deg,#ff5fa8,#8b6cff);border-radius:999px;padding:4px 28px;margin-top:4px}
/* 金（素材が届くまでは色で金にする） */
.gim{width:64px;height:40px;object-fit:contain;vertical-align:middle}
.gfloat .gim{width:80px;height:50px}
.gms .gi .gim{width:300px;height:180px}
img.gold,.gim.gold,#gdress .gdi.gold canvas{filter:grayscale(1) sepia(1) saturate(4) hue-rotate(2deg) brightness(1.45) contrast(1.15) drop-shadow(0 0 18px rgba(255,210,80,.9))}
.gdim.gold{background:radial-gradient(circle at 50% 52%,rgba(90,60,0,.35),rgba(0,0,0,.8) 75%)}
.gbox.gold{scale:1.25;transform-origin:50% 100%}
.gbox.gold .gb-body{background:linear-gradient(160deg,#fff3b0 0%,#ffd25e 40%,#d99a00 100%);box-shadow:inset 0 -16px 0 rgba(120,70,0,.25),inset 0 10px 0 rgba(255,255,255,.4),0 18px 40px rgba(0,0,0,.45)}
.gbox.gold .gb-lid{background:linear-gradient(160deg,#fff7cc,#ffd84a 55%,#e0a400)}
.gbox.gold .gb-body i,.gbox.gold .gb-lid i{background:linear-gradient(90deg,#b8002e,#ff4f7a 45%,#e0003a 60%,#b8002e)}
.gbox.gold .gb-lid b{background:radial-gradient(ellipse at 25% 60%,#ff3d6e 0 37%,#b8002e 38% 40%,transparent 41%),radial-gradient(ellipse at 75% 60%,#ff3d6e 0 37%,#b8002e 38% 40%,transparent 41%),radial-gradient(circle at 50% 85%,#ffd25e 0 14%,transparent 15%)}
.gbox.gold.charge2{animation:gbshake .08s linear infinite}
.gbox.gold.charge2 .gb-body{box-shadow:0 0 60px 20px rgba(255,230,120,1),0 0 200px 60px rgba(255,200,60,.7)}
.gbox.gold .gb-rays{background:repeating-conic-gradient(rgba(255,215,90,.75) 0 6deg,transparent 6deg 14deg)}
.gbox.gold .gb-halo{background:radial-gradient(circle,#fff 0,rgba(255,225,120,.75) 28%,rgba(255,170,0,0) 65%)}
.gbox.gold .gb-beam{width:360px;margin-left:-180px;background:linear-gradient(0deg,#fffbe0,rgba(255,215,90,.6) 50%,rgba(255,215,90,0))}
.gflash.gold{background:radial-gradient(circle,#fff 0,#fff6c8 35%,rgba(255,215,90,0) 75%);animation-duration:1.1s}
.gring.r3{border-color:rgba(255,210,80,.95);animation-delay:.3s;opacity:0}
.gring.r4{border-color:#fff;animation-delay:.45s;opacity:0}
.gbox-tx.gold b{font-size:104px;color:#ffe680;-webkit-text-stroke:7px #7a4a00;paint-order:stroke fill;text-shadow:0 0 30px rgba(255,210,80,1),0 6px 0 #5a3500}
.gbox-tx.gold span{background:linear-gradient(90deg,#ffb000,#ff5fa8)}
.gbox-tx .g100{font-style:normal;font-size:44px;font-weight:900;color:#fff;background:linear-gradient(90deg,#e0a400,#ffd25e,#e0a400);border-radius:999px;padding:4px 30px;margin-bottom:6px;animation:rbw 2s linear infinite;background-size:200% 100%}
.gbox.vid .gb-item{animation:gbitem 1s cubic-bezier(.2,1.5,.4,1) forwards,gbbob 2.4s 1.1s ease-in-out infinite}
@keyframes gbdrop{0%{opacity:0;transform:translateY(-520px) scale(.8)}70%{opacity:1;transform:translateY(0) scale(1.08,.92)}100%{transform:none}}
@keyframes gbshake{0%{transform:rotate(-4deg) translateX(-4px)}50%{transform:rotate(4deg) translateX(4px)}100%{transform:rotate(-4deg) translateX(-4px)}}
@keyframes gblid{0%{transform:none}100%{transform:translate(-260px,-520px) rotate(-200deg);opacity:0}}
@keyframes gbitem{0%{opacity:0;transform:translateY(80px) scale(.2)}60%{opacity:1;transform:translateY(-290px) scale(1.85)}100%{opacity:1;transform:translateY(-250px) scale(1.6)}}
@keyframes gbbob{0%,100%{translate:0 0}50%{translate:0 -14px}}
@keyframes gtw{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(45deg)}}
@keyframes gbhalo{0%{opacity:0;transform:translateY(-220px) scale(.3)}25%{opacity:1;transform:translateY(-220px) scale(1.15)}100%{opacity:.75;transform:translateY(-220px) scale(1)}}
@keyframes gbbeam{0%{opacity:0;transform:scaleY(.1)}25%{opacity:1;transform:scaleY(1)}100%{opacity:0;transform:scaleY(1) scaleX(1.6)}}
@keyframes gflash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
@keyframes gring{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(7)}}
@keyframes gtxin{from{opacity:0;transform:scale(2.2)}to{opacity:1;transform:none}}
@keyframes gbrays{0%{opacity:0;transform:rotate(0)}12%{opacity:1}100%{opacity:.8;transform:rotate(80deg)}}
#gdress{position:absolute;inset:0}
#gdress .gdi{position:absolute;transform:translate(-50%,-50%);aspect-ratio:16/9}
#gdress .gdi canvas{width:100%;height:100%;display:block}
#gtop canvas{position:absolute;inset:0;width:100%;height:100%}
.gchip{position:relative;animation:inr .35s ease both;display:flex;align-items:center;gap:14px;background:rgba(20,16,32,.86);color:#fff;border:3px solid #ff7ab8;border-radius:999px;padding:10px 26px 10px 12px;font-size:30px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:inr .4s ease both}
.gchip .gi{font-size:56px;line-height:1}
.gchip small{display:block;font-size:20px;font-weight:700;color:#ffb3d6}
.gchip .cb{font-size:40px;color:#ffd25e;font-weight:900;margin-left:6px}
.gchip .cb:empty{display:none}
.gchip .cb.hit{animation:cbhit .25s ease-out}
@keyframes cbhit{from{transform:scale(1.5)}to{transform:none}}
/* 100コンボごとに札が豪華に */
.gchip.lv1{border-color:#ff5fa8;box-shadow:0 0 24px rgba(255,95,168,.7)}
.gchip.lv1 .cb{font-size:48px}
.gchip.lv2,.gchip.lv3{border-color:#ffd25e;background:linear-gradient(90deg,rgba(60,40,10,.92),rgba(30,20,40,.9));box-shadow:0 0 30px rgba(255,210,94,.8)}
.gchip.lv2 .cb,.gchip.lv3 .cb{font-size:56px;color:#fff3b0;text-shadow:0 0 14px #ffb347}
.gchip.lv3{transform:scale(1.08);transform-origin:right center}
.gchip.lv4,.gchip.lv5,.gchip.lv6,.gchip.lv7,.gchip.lv8,.gchip.lv9{border:4px solid transparent;background:linear-gradient(rgba(25,15,40,.95),rgba(25,15,40,.95)) padding-box,linear-gradient(90deg,#ff5fa8,#ffd25e,#8be3ff,#b6ff8a,#ff5fa8) border-box;background-size:auto,300% 100%;animation:rbw 1.6s linear infinite;box-shadow:0 0 40px rgba(255,255,255,.5);transform:scale(1.15);transform-origin:right center}
.gchip.lv6,.gchip.lv7,.gchip.lv8,.gchip.lv9{transform:scale(1.25)}
.gchip.lv4 .cb,.gchip.lv5 .cb,.gchip.lv6 .cb,.gchip.lv7 .cb,.gchip.lv8 .cb,.gchip.lv9 .cb{font-size:64px;background:linear-gradient(90deg,#ff5fa8,#ffd25e,#8be3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes rbw{to{background-position:0 0,300% 0}}
.gms{position:absolute;left:0;right:0;top:22%;display:flex;flex-direction:column;align-items:center;gap:6px;animation:gmsin .5s cubic-bezier(.2,1.6,.4,1) both;text-align:center}

        hop: 1.6 + Math.random() * 1.4, nb: 2 + Math.random() * 1.5, q: new T.Quaternion() };

  async function chinchiroPlay(s) {

  // ルーレット：盤が回って、決まったマスで止まる
  async function roulettePlay(s) {
    const seg = Math.max(0, Math.min(7, Number(String(s.rand.code).replace(/^r/, "")) || 0));
    const dim = gEl("", "gdim");
    const { cv, x } = mkCv(); const U = Math.min(GW, GH) / 1080, cx = GW / 2, cy = GH * 0.61, R = 290 * U, N = RL_LABELS.length, st = (Math.PI * 2) / N;

      }

  window.VBUI_RAND = { localResult, yakuOf, yakuName, RL_LABELS };   // 確認用

  // ===== 覗き演出（静かな時間に、画面の右下から小さなキャラが覗く） =====
