<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920,initial-scale=1">
<title>Vぶい 演出画面</title>
<style>
/* OBSのブラウザソース用。背景は透明。ふだんは何も表示しない */
html,body{margin:0;background:transparent;overflow:hidden;width:100vw;height:100vh;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
#stack{position:absolute;left:32px;bottom:32px;width:560px;display:flex;flex-direction:column;gap:10px}
.cm{display:flex;gap:12px;align-items:flex-start;background:rgba(20,16,32,.82);color:#fff;border:2px solid #ff7ab8;border-radius:18px;padding:12px 16px;font-size:26px;line-height:1.45;box-shadow:0 6px 18px rgba(0,0,0,.35);animation:in .35s cubic-bezier(.2,.9,.3,1.2) both}
.cm.out{animation:out .5s ease both}
.cm img,.cm .av{width:44px;height:44px;border-radius:50%;flex:none;object-fit:cover;background:#2b2340;display:grid;place-items:center;font-weight:700;color:#ffc24a}
.cm b{display:block;font-size:18px;color:#ffb3d6}
.cm b i{font-style:normal;font-size:14px;background:#ff5fa8;color:#fff;border-radius:6px;padding:0 6px;margin-left:8px}
#fx{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.banner{background:linear-gradient(90deg,#ff5fa8,#3fb8f5);color:#fff;font-weight:900;font-size:64px;padding:26px 56px;border-radius:28px;box-shadow:0 10px 40px rgba(0,0,0,.4);text-align:center;animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}
.banner small{display:block;font-size:28px;font-weight:700;margin-top:6px;opacity:.95}
.banner.out{animation:out .6s ease both}
@keyframes in{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateY(10px)}}
#err{position:absolute;left:24px;top:24px;background:#e5333d;color:#fff;font-size:22px;font-weight:700;border-radius:12px;padding:10px 16px;display:none}
</style>
</head>
<body>
<div id="stack"></div>
<div id="fx"></div>
<div id="err"></div>
<script>
(() => {
  const SB = "https://sgmzyhvhwbqyudayboes.supabase.co";
  const PK = "sb_publishable_igtK18JrLPQCoKbF0U03Gg_o8fKrApc";
  const q = new URLSearchParams(location.search);
  const KEY = q.get("k") || "";
  const OC = q.get("oc") !== "0";                 // わんコメにも流す（初期はオン）
  const OC_URL = q.get("ocurl") || "http://localhost:11180";
  const SHOW = q.get("show");                     // "1"=この画面にもコメントを出す / "0"=出さない / 無し=わんコメが使えない時だけ出す
  let after = 0, ack = null, onecomme = null, ocService = q.get("ocsvc") || null, failCount = 0;
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const err = (t) => { const e = $("#err"); e.textContent = t; e.style.display = t ? "block" : "none"; };
  if (!KEY) { err("Vぶい：URLにカギ（k=…）がありません。Vぶいの設定画面からURLをコピーし直してください"); return; }

  // ---- わんコメ（配信者さんのPCで動いているコメントツール）に、Vぶいのコメントを混ぜる ----
  async function ocInit() {
    if (!OC) { onecomme = false; return; }
    try {
      if (!ocService) {
        const r = await fetch(OC_URL + "/api/services", { cache: "no-store" });
        const list = await r.json();
        const arr = Array.isArray(list) ? list : (list.services || list.data || []);
        ocService = arr[0]?.id || null;
      }
      onecomme = !!ocService;
    } catch { onecomme = false; }
  }
  async function ocSend(c) {
    if (!onecomme) return false;
    try {
      const r = await fetch(OC_URL + "/api/comments", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
        service: { id: ocService },
        comment: { id: "vbui-" + c.id, userId: "vbui-" + (c.nickname || ""), name: (c.nickname || "Vぶい") + " ［Vぶい］", comment: c.body, profileImage: c.avatar_url || "https://vvbuibui.com/icon-192.png", badges: [{ label: "Vぶい", url: "https://vvbuibui.com/icon-192.png" }], hasGift: false, isOwner: false, timestamp: Date.parse(c.created_at) || Date.now() },
      }) });
      return r.ok;
    } catch { onecomme = false; return false; }
  }

  // ---- この画面に直接コメントを出す（わんコメを使っていない人向け） ----
  function showComment(c) {
    const el = document.createElement("div"); el.className = "cm";
    el.innerHTML = `${c.avatar_url ? `<img src="${esc(c.avatar_url)}" alt="">` : `<span class="av">${esc([...(c.nickname || "V")][0])}</span>`}<div><b>${esc(c.nickname)}<i>Vぶい</i></b>${esc(c.body)}</div>`;
    const st = $("#stack"); st.appendChild(el);
    while (st.children.length > 5) st.firstChild.remove();
    setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 600); }, 15000);
  }
  // ---- 演出（ギフトなどは今後ここに追加） ----
  function banner(title, sub, ms = 5000) {
    const fx = $("#fx"); const b = document.createElement("div"); b.className = "banner";
    b.innerHTML = `${esc(title)}${sub ? `<small>${esc(sub)}</small>` : ""}`; fx.innerHTML = ""; fx.appendChild(b);
    setTimeout(() => { b.classList.add("out"); setTimeout(() => b.remove(), 700); }, ms);
  }
  window.VBUI_EFFECT = (type, data) => { /* ギフト演出の入口（準備中） */ banner(data?.title || "🎁", data?.sub || "", 4000); };

  async function poll() {
    try {
      const r = await fetch(SB + "/functions/v1/overlay", { method: "POST", headers: { apikey: PK, Authorization: "Bearer " + PK, "Content-Type": "application/json" },
        body: JSON.stringify({ action: "poll", key: KEY, after, onecomme: onecomme === true, ack }) });
      const d = await r.json();
      if (d.error === "bad_key") { err("Vぶい：このURLは使えなくなりました。Vぶいの設定画面から新しいURLをコピーしてください"); return setTimeout(poll, 30000); }
      if (!r.ok) throw new Error(d.error);
      err(""); failCount = 0; after = d.last || after;
      for (const c of d.items || []) {
        if (c.kind === "test") {
          ack = c.id;
          banner("✅ Vぶいと接続できました", onecomme ? "わんコメにもテストのコメントを送りました" : "わんコメは見つかりませんでした（Vぶいの画面にコメントを表示します）");
          const sent = await ocSend(c); if (!sent) showComment(c);
          continue;
        }
        const sent = SHOW === "1" ? false : await ocSend(c);
        if (SHOW === "1" || (!sent && SHOW !== "0")) showComment(c);
      }
    } catch { if (++failCount > 5) err("Vぶい：通信できません。インターネットの接続を確認してください"); }
    setTimeout(poll, 2000);
  }
  ocInit().then(poll);
  setInterval(() => { if (onecomme === false && OC) ocInit(); }, 60000);
})();
</script>
</body>
</html>
