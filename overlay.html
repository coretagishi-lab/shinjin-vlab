<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vぶい 演出画面</title>
<style>
/* OBSのブラウザソース用。背景は透明。ふだんは何も表示しない（配信画面のレイアウトには一切さわらない） */
html,body{margin:0;background:transparent;overflow:hidden;width:100vw;height:100vh;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
/* 1920×1080 を基準に作って、OBSの画面サイズに合わせて縮める（720pでも1080pでも同じ見え方） */
#root{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
#stack{position:absolute;width:560px;display:flex;flex-direction:column;gap:10px}
#stack.bl{left:32px;bottom:32px;transform-origin:0 100%}
#stack.br{right:32px;bottom:32px;transform-origin:100% 100%;align-items:flex-end}
#stack.tl{left:32px;top:32px;transform-origin:0 0;flex-direction:column-reverse;justify-content:flex-end}
#stack.tr{right:32px;top:32px;transform-origin:100% 0;align-items:flex-end;flex-direction:column-reverse;justify-content:flex-end}
.cm{display:flex;gap:12px;align-items:flex-start;background:rgba(20,16,32,.82);color:#fff;border:2px solid #ff7ab8;border-radius:18px;padding:12px 16px;font-size:26px;line-height:1.45;box-shadow:0 6px 18px rgba(0,0,0,.35);animation:in .35s cubic-bezier(.2,.9,.3,1.2) both;max-width:100%;box-sizing:border-box;word-break:break-word}
#stack.br .cm,#stack.tr .cm{animation-name:inr}
.cm.out{animation:out .5s ease both}
.cm.pv{border-style:dashed;background:rgba(20,16,32,.6)}
.cm.hr{border-color:#ffc24a}
.cm img,.cm .av{width:44px;height:44px;border-radius:50%;flex:none;object-fit:cover;background:#2b2340;display:grid;place-items:center;font-weight:700;color:#ffc24a}
.cm b{display:block;font-size:18px;color:#ffb3d6}
.cm b i{font-style:normal;font-size:14px;background:#ff5fa8;color:#fff;border-radius:6px;padding:0 6px;margin-left:8px}
#fx{position:absolute;inset:0;display:grid;place-items:center}
.banner{background:linear-gradient(90deg,#ff5fa8,#3fb8f5);color:#fff;font-weight:900;font-size:64px;padding:26px 56px;border-radius:28px;box-shadow:0 10px 40px rgba(0,0,0,.4);text-align:center;animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}
.banner small{display:block;font-size:28px;font-weight:700;margin-top:6px;opacity:.95}
.banner.out{animation:out .6s ease both}
@keyframes in{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes inr{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateY(10px)}}
#err{position:absolute;left:24px;top:24px;background:#e5333d;color:#fff;font-size:22px;font-weight:700;border-radius:12px;padding:10px 16px;display:none}

/* ---- ギフトの演出（小：画面のすみ／中：やや大きく／大：全画面） ---- */
#groot{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
#gfx{position:absolute;inset:0;overflow:hidden}
#gfx canvas{position:absolute;inset:0;width:100%;height:100%}
#gfx .gvid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.cm.gf b i{background:#ff5fa8}
.gchip{position:absolute;right:40px;bottom:200px;display:flex;align-items:center;gap:14px;background:rgba(20,16,32,.86);color:#fff;border:3px solid #ff7ab8;border-radius:999px;padding:10px 26px 10px 12px;font-size:30px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:inr .4s ease both}
.gchip .gi{font-size:56px;line-height:1}
.gchip small{display:block;font-size:20px;font-weight:700;color:#ffb3d6}
.gchip .cb{font-size:40px;color:#ffd25e;font-weight:900;margin-left:6px}
.gfloat{position:absolute;font-size:72px;animation:gfl 2.6s ease-out forwards}
@keyframes gfl{from{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1}to{opacity:0;transform:translateY(-520px) scale(1.2)}}
.gmid{position:absolute;left:0;right:0;bottom:150px;display:flex;flex-direction:column;align-items:center;gap:8px;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.gmid .gi{font-size:200px;line-height:1;filter:drop-shadow(0 10px 30px rgba(255,111,163,.6));animation:gbob 1s ease-in-out infinite alternate}
@keyframes gbob{to{transform:translateY(-14px) rotate(4deg)}}
.gname{background:linear-gradient(90deg,#ff5fa8,#8b6cff);color:#fff;font-weight:900;font-size:44px;border-radius:999px;padding:10px 34px;box-shadow:0 8px 30px rgba(0,0,0,.35);white-space:nowrap}
.gname em{font-style:normal;color:#ffe27a}
.gname .cb{color:#ffe27a;margin-left:10px}
.gbig{position:absolute;inset:0;display:grid;place-items:center;animation:gfade .6s ease both}
.gbig .gi{font-size:380px;line-height:1;filter:drop-shadow(0 0 60px rgba(160,140,255,.9));animation:gzoom 5.5s ease-out both}
@keyframes gzoom{from{transform:scale(.3) rotate(-20deg);opacity:0}15%{transform:scale(1.15) rotate(4deg);opacity:1}25%{transform:scale(1)}to{transform:scale(1.08)}}
.gbig .gname{position:absolute;bottom:130px;font-size:64px;padding:16px 48px}
@keyframes gfade{from{opacity:0}to{opacity:1}}
.gout{animation:out .6s ease both!important}
/* ---- 救援ヒーロー（救援通知から駆けつけたリスナーさんの登場演出） ---- */
.hero{position:absolute;left:0;top:0;width:120px;height:120px;will-change:transform}
.hero .hb{position:absolute;inset:0}
.hero .cape{position:absolute;left:-58px;top:22px;width:120px;height:96px;transform-origin:100% 20%}
.hero.l .cape{left:58px;transform:scaleX(-1);transform-origin:50% 20%}
.hero.fly .cape{animation:flap .18s ease-in-out infinite alternate}
.hero.walk .cape{animation:flap .35s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleY(.82) rotate(-6deg)}}
.hero.l.fly .cape,.hero.l.walk .cape{animation-name:flapl}
@keyframes flapl{from{transform:scaleX(-1)}to{transform:scaleX(-1) scaleY(.82) rotate(-6deg)}}
.hero .face{position:absolute;inset:8px;border-radius:50%;border:5px solid #fff;background:#2b2340;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.4);display:grid;place-items:center;color:#ffc24a;font-weight:900;font-size:44px}
.hero .face img{width:100%;height:100%;object-fit:cover}
.hero .emb{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);background:#ffc24a;color:#2b2340;font-weight:900;font-size:18px;border-radius:8px;padding:0 8px;border:3px solid #fff;white-space:nowrap}
.hero.walk .hb{animation:bob .3s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-12px) rotate(4deg)}}
.hero .tag{position:absolute;bottom:132px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff;color:#2b2340;font-weight:900;font-size:24px;border-radius:14px;padding:6px 14px;box-shadow:0 4px 12px rgba(0,0,0,.3);opacity:0;transition:opacity .25s}
.hero .tag em{font-style:normal;color:#ff5fa8}
.hero.named .tag{opacity:1}
.puff{position:absolute;width:140px;height:40px;border-radius:50%;background:radial-gradient(rgba(255,255,255,.9),rgba(255,255,255,0) 70%);animation:puff .5s ease-out both}
@keyframes puff{from{opacity:1;transform:scale(.4)}to{opacity:0;transform:scale(1.6)}}
</style>
</head>
<body>
<div id="groot"><div id="gfx"></div></div><div id="root"><div id="stack" class="bl"></div><div id="fx"></div></div>
<div id="err"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(() => {
  const SB = "https://sgmzyhvhwbqyudayboes.supabase.co";
  const PK = "sb_publishable_igtK18JrLPQCoKbF0U03Gg_o8fKrApc";
  const q = new URLSearchParams(location.search);
  const KEY = q.get("k") || "";
  const DEMO = q.get("demo") === "1";              // Vぶいの視聴画面でのお試し（演出だけ。どこにもつながない）
  const OC = q.get("oc") !== "0";                 // わんコメにも流す（初期はオン）
  const OC_URL = q.get("ocurl") || "http://localhost:11180";
  const SHOW_URL = q.get("show");                 // URLで指定があればそれを優先（"1"/"0"）
  const W = 1920, H = 1080;
  let started = false, after = 0, ack = null, onecomme = null, ocService = q.get("ocsvc") || null, failCount = 0;
  let S = { pos: "bl", size: "m", show: "auto", side: "r", hero: true, oc: "" }, settingsAt = undefined;
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const err = (t) => { const e = $("#err"); e.textContent = t; e.style.display = t ? "block" : "none"; };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  // 画面サイズに合わせて 1920×1080 の座標を縮める
  function fit() {
    const s = Math.min(innerWidth / W, innerHeight / H) || 1, r = $("#root");
    r.style.width = innerWidth / s + "px"; r.style.height = innerHeight / s + "px"; r.style.transform = `scale(${s})`;
  }
  // ギフトの演出は、横長なら1920×1080、縦長なら1080×1920として描く（短い辺を1080にそろえる。1つの演出で縦横どちらにも合う）
  let GW = 1920, GH = 1080;
  function gfit() {
    const port = innerHeight > innerWidth, bw = port ? 1080 : 1920, bh = port ? 1920 : 1080;
    const s = Math.min(innerWidth / bw, innerHeight / bh) || 1, r = $("#groot");
    GW = innerWidth / s; GH = innerHeight / s; r.style.width = GW + "px"; r.style.height = GH + "px"; r.style.transform = `scale(${s})`;
  }
  addEventListener("resize", () => { fit(); gfit(); }); fit(); gfit();
  const vw = () => $("#root").offsetWidth, vh = () => $("#root").offsetHeight;

  function applySettings() {
    const st = $("#stack"); st.className = S.pos;
    st.style.transform = `scale(${{ s: 0.75, m: 1, l: 1.3 }[S.size] || 1})`;
  }
  // わんコメを使わない人（oc=no）は、いつもこの画面にコメントを出す
  const showMode = () => SHOW_URL === "1" ? "on" : SHOW_URL === "0" ? "off" : S.oc === "no" ? "on" : S.show;

  if (!KEY && !DEMO) { err("Vぶい：URLにカギ（k=…）がありません。Vぶいの設定画面からURLをコピーし直してください"); return; }

  // ---- わんコメ（配信者さんのPCで動いているコメントツール）に、Vぶいのコメントを混ぜる ----
  async function ocInit() {
    if (!OC) { onecomme = false; return; }
    try {
      if (!ocService) {
        const r = await fetch(OC_URL + "/api/services", { cache: "no-store" });
        const list = await r.json();
        const arr = Array.isArray(list) ? list : (list.services || list.data || []);
        ocService = arr[0]?.id || null;
      }
      onecomme = !!ocService;
    } catch { onecomme = false; }
  }
  async function ocSend(c, text) {
    if (!onecomme) return false;
    try {
      const r = await fetch(OC_URL + "/api/comments", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
        service: { id: ocService },
        comment: { id: "vbui-" + c.id, userId: "vbui-" + (c.nickname || ""), name: (c.nickname || "Vぶい") + " ［Vぶい］", comment: text ?? c.body, profileImage: c.avatar_url || "https://vvbuibui.com/icon-192.png", badges: [{ label: "Vぶい", url: "https://vvbuibui.com/icon-192.png" }], hasGift: false, isOwner: false, timestamp: Date.parse(c.created_at) || Date.now() },
      }) });
      return r.ok;
    } catch { onecomme = false; return false; }
  }

  // ---- この画面に直接コメントを出す（わんコメを使っていない人向け／設定で「いつも出す」の人） ----
  function showComment(c, { cls = "", text, ms = 15000 } = {}) {
    const el = document.createElement("div"); el.className = "cm " + cls; if (c.id) el.dataset.id = c.id;
    el.innerHTML = `${c.avatar_url ? `<img src="${esc(c.avatar_url)}" alt="">` : `<span class="av">${esc([...(c.nickname || "V")][0])}</span>`}<div><b>${esc(c.nickname)}<i>Vぶい</i></b>${esc(text ?? c.body)}</div>`;
    const st = $("#stack"); st.appendChild(el);
    while (st.children.length > 5) st.firstChild.remove();
    setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 600); }, ms);
  }
  // わんコメ優先、なければこの画面に（設定に従う）
  async function deliver(c, opt = {}) {
    const mode = showMode();
    const sent = mode === "on" ? false : await ocSend(c, opt.text);
    if (mode === "on" || (!sent && mode !== "off")) showComment(c, opt);
  }
  // 設定を変えた直後：どこに出るかを数秒だけ見せる
  function preview() {
    const mode = showMode();
    const sample = { nickname: "表示位置の確認", body: mode === "off" ? "（この画面にはコメントを出さない設定です）" : "Vぶいのコメントはここに出ます" };
    showComment(sample, { cls: "pv", ms: 6000 });
  }

  // ---- 演出（ギフトなどは今後ここに追加） ----
  function banner(title, sub, ms = 5000) {
    const fx = $("#fx"); const b = document.createElement("div"); b.className = "banner";
    b.innerHTML = `${esc(title)}${sub ? `<small>${esc(sub)}</small>` : ""}`; fx.innerHTML = ""; fx.appendChild(b);
    setTimeout(() => { b.classList.add("out"); setTimeout(() => b.remove(), 700); }, ms);
  }
  window.VBUI_EFFECT = (type, data) => { /* ギフト演出の入口（準備中） */ banner(data?.title || "🎁", data?.sub || "", 4000); };

  // ---- 救援ヒーロー：画面の端に小さく飛んできて、着地、とことこ歩いてコメント欄の方へ飛び込む ----
  const CAPE = `<svg class="cape" viewBox="0 0 120 96"><path d="M118 6 C80 0 40 10 4 30 C18 44 10 66 0 92 C40 80 78 60 118 40 Z" fill="#ff5fa8"/><path d="M118 6 C84 4 52 14 22 30 C34 40 30 58 24 76 C56 62 88 48 118 40 Z" fill="#ff8cc4"/></svg>`;
  const heroQ = []; let heroBusy = false;
  function hero(c) { if (heroQ.length < 6) heroQ.push(c); if (!heroBusy) heroNext(); }
  async function heroNext() {
    const c = heroQ.shift(); if (!c) { heroBusy = false; return; }
    heroBusy = true;
    try { await heroPlay(c); } catch {}
    await wait(300); heroNext();
  }
  async function heroPlay(c) {
    // わんコメを使わない人は、コメントを出している側（四隅の左右）に飛び込む
    const side = S.oc === "no" ? (S.pos[1] === "l" ? "l" : "r") : S.side;
    const R = side === "r", dir = R ? 1 : -1, w = vw(), h = vh(), size = 120;
    const el = document.createElement("div"); el.className = "hero fly" + (R ? "" : " l");
    const face = c.avatar_url ? `<img src="${esc(c.avatar_url)}" alt="">` : esc([...(c.nickname || "V")][0]);
    el.innerHTML = `<div class="hb">${CAPE}<div class="face">${face}</div><span class="emb">救援</span></div><div class="tag"><em>${esc(c.nickname)}</em> さんが救援にきた！</div>`;
    $("#root").appendChild(el);
    const landX = R ? w - 560 : 560 - size, landY = Math.round(h * 0.56);
    const startX = landX - dir * 520, startY = -180;
    const edgeX = R ? w - size - 24 : 24, outX = R ? w + 60 : -size - 60;
    const T = (x, y, rot = 0, sc = 1) => `translate(${x}px,${y}px) rotate(${rot}deg) scale(${sc})`;
    // 1) 斜め上から飛んでくる
    await el.animate([{ transform: T(startX, startY, dir * 35, 0.8) }, { transform: T(landX - dir * 60, landY - 40, dir * 15, 1) }, { transform: T(landX, landY, 0, 1) }], { duration: 1000, easing: "cubic-bezier(.3,.7,.4,1)", fill: "forwards" }).finished;
    // 2) 着地（ぽよん＋けむり）
    const puff = document.createElement("div"); puff.className = "puff"; puff.style.left = landX - 10 + "px"; puff.style.top = landY + size - 24 + "px"; $("#root").appendChild(puff); setTimeout(() => puff.remove(), 600);
    el.classList.remove("fly");
    await el.animate([{ transform: T(landX, landY) + " scale(1.15,.82)" }, { transform: T(landX, landY - 18) + " scale(.95,1.06)" }, { transform: T(landX, landY) }], { duration: 380, easing: "ease-out", fill: "forwards" }).finished;
    // 3) 名前を出して、とことこ歩く
    el.classList.add("named", "walk");
    await wait(500);
    await el.animate([{ transform: T(landX, landY) }, { transform: T(edgeX, landY) }], { duration: Math.max(1400, Math.abs(edgeX - landX) * 5.2), easing: "linear", fill: "forwards" }).finished;
    // 4) ぴょんっとコメント欄へ飛び込む
    el.classList.remove("walk", "named");
    await el.animate([{ transform: T(edgeX, landY) }, { transform: T((edgeX + outX) / 2, landY - 90, dir * 20, 0.85) }, { transform: T(outX, landY - 20, dir * 40, 0.5), opacity: 0.6 }], { duration: 620, easing: "ease-in", fill: "forwards" }).finished;
    el.remove();
    await deliver(c, { cls: "hr", text: "🦸 救援に駆けつけました！" });
  }
  window.VBUI_HERO = hero; // 確認用

  // ===== ギフト演出 =====
  //  ・演出でエラーが起きても、ここで止める（配信やほかの表示には影響させない）
  //  ・たくさん届いたら順番に出す。たまりすぎたら古い小さいギフトから間引く
  //  ・同じ人の同じギフトの連打は「×N」にまとめる
  //  ・素材が出せないときは、名前の帯だけ出す
  let CAT = {}; const GQ = []; let gBusy = false, gNow = null; const GQ_MAX = 20;
  async function loadCatalog() {
    try { const r = await fetch(SB + "/rest/v1/gift_catalog?select=id,name,price,tier,effect,icon", { headers: { apikey: PK, Authorization: "Bearer " + PK } }); const a = await r.json(); if (Array.isArray(a)) a.forEach((g) => (CAT[g.id] = g)); } catch {}
  }
  loadCatalog(); setInterval(loadCatalog, 10 * 60e3);
  // 「出ました」「出せませんでした」をVぶいに知らせる（出せなかった分は視聴者に返金される）。まとめて送り、失敗したらもう一度
  const ACK = { shown: [], dropped: [] }; let ackTry = 0;
  const ackIds = (ids, kind) => { if (!KEY) return; ids.forEach((id) => Number.isFinite(id) && ACK[kind].push(id)); };
  setInterval(async () => {
    if (!ACK.shown.length && !ACK.dropped.length) return;
    const b = { shown: ACK.shown.splice(0, 100), dropped: ACK.dropped.splice(0, 100) };
    try { const r = await fetch(SB + "/functions/v1/gift", { method: "POST", headers: { apikey: PK, Authorization: "Bearer " + PK, "Content-Type": "application/json" }, body: JSON.stringify({ action: "shown", key: KEY, ...b }) }); if (!r.ok) throw 0; ackTry = 0; }
    catch { if (++ackTry < 20) { ACK.shown.unshift(...b.shown); ACK.dropped.unshift(...b.dropped); } }
  }, 1500);
  function giftIn(c) {
    const id = Number(c.id);
    if (c.created_at && Date.now() - Date.parse(c.created_at) > 60e3) { ackIds([id], "dropped"); return; } // つながり直したときの古いギフトは出さない（返金）
    const [, gid, cb] = String(c.body || "").split(":"); const combo = Number(cb) || 1;
    const g = CAT[gid] || { id: gid, name: "ギフト", tier: "small", effect: "", icon: "🎁" };
    const key = (c.nickname || "") + "|" + gid;
    if (gNow && gNow.key === key) { gNow.bump(combo); ackIds([id], "shown"); return; }   // いま出ているものと同じ → ×Nを増やす（コメント欄には最後に1回だけ）
    const same = GQ.find((x) => x.key === key); if (same) { same.combo = Math.max(same.combo, combo); same.ids.push(id); return; }
    // コメント欄にも「〇〇を贈りました」を流す（わんコメ／この画面のコメント枠。設定に従う）。連打は最後に「×N」で1回だけ
    gLine(c, g, combo);
    if (GQ.length >= GQ_MAX) { const i = GQ.findIndex((x) => x.g.tier === "small"); const [out] = GQ.splice(i >= 0 ? i : 0, 1); if (out) ackIds(out.ids, "dropped"); } // あふれた分は返金
    GQ.push({ key, g, combo, nick: c.nickname || "リスナー", ids: [id] });
    if (!gBusy) gNext();
  }
  const gLine = (c, g, n) => { try { deliver({ ...c, id: (c.id || "x") + "-" + n }, { cls: "gf", text: `🎁 ${g.name}を贈りました${n > 1 ? ` ×${n}` : ""}` }); } catch {} };
  const EXTRA_MAX = 6000; // 連打で演出が延びるのは最大6秒まで（100回押されても固まらない）
  async function gNext() {
    const it = GQ.shift(); if (!it) { gBusy = false; gNow = null; return; }
    gBusy = true; ackIds(it.ids, "shown");
    const c0 = it.combo;
    try { await gPlay(it); } catch { try { await gFallback(it); } catch {} }
    if (it.combo > c0) gLine({ id: it.ids[0], nickname: it.nick }, it.g, it.combo);
    gNow = null; await wait(250); gNext();
  }
  const comboTxt = (n) => (n > 1 ? `<span class="cb">×${n}</span>` : "");
  function gEl(html, cls) { const el = document.createElement("div"); el.className = cls; el.innerHTML = html; $("#gfx").appendChild(el); return el; }
  async function gEnd(els, ms) { await wait(ms); els.forEach((e) => e && e.classList.add("gout")); await wait(600); els.forEach((e) => e && e.remove()); }
  async function gFallback(it) { const el = gEl(`<div class="gname"><em>${esc(it.nick)}</em> さんから ${esc(it.g.name)}${comboTxt(it.combo)}</div>`, "gmid"); await gEnd([el], 3500); }
  async function gPlay(it) {
    const g = it.g, ic = esc(g.icon || "🎁");
    let cbEl = null; const setCombo = (n) => { it.combo = n; if (cbEl) cbEl.innerHTML = comboTxt(n); };
    if (g.tier === "small") {
      const el = gEl(`<span class="gi">${ic}</span><span><small>${esc(it.nick)} さんから</small>${esc(g.name)}<span class="cbw">${comboTxt(it.combo)}</span></span>`, "gchip"); cbEl = el.querySelector(".cbw");
      const fl = []; const burst = () => { if (fl.filter((f) => f.isConnected).length > 30) return; for (let i = 0; i < 6; i++) { const f = gEl(ic, "gfloat"); f.style.right = 80 + Math.random() * 380 + "px"; f.style.bottom = 220 + Math.random() * 60 + "px"; f.style.animationDelay = i * 0.12 + "s"; fl.push(f); } };
      let extra = 0, ext = 0; gNow = { key: it.key, bump: (n) => { setCombo(n); burst(); const d = Math.min(900, EXTRA_MAX - ext); if (d > 0) { extra += d; ext += d; } } };
      burst(); await wait(3200); while (extra > 0) { const e = extra; extra = 0; await wait(e); }
      await gEnd([el, ...fl], 0); return;
    }
    if (g.tier === "mid") {
      const cv = sparkle(4200, ["#ff7ab8", "#ffd25e", "#8be3ff"], 0.75);
      const el = gEl(`<span class="gi">${ic}</span><div class="gname"><em>${esc(it.nick)}</em> さんから ${esc(g.name)}<span class="cbw">${comboTxt(it.combo)}</span></div>`, "gmid"); cbEl = el.querySelector(".cbw");
      let extra = 0, ext = 0; gNow = { key: it.key, bump: (n) => { setCombo(n); const d = Math.min(1200, EXTRA_MAX - ext); if (d > 0) { extra += d; ext += d; } } };
      await wait(4200); while (extra > 0) { const e = extra; extra = 0; await wait(e); }
      await gEnd([el, cv], 0); return;
    }
    // 大：全画面。動画（背景が透けるWebM）が登録されていれば動画、なければ絵の演出
    let vid = null;
    if (g.video_url) vid = await gVideo(g.video_url);                 // 読めなかったら null → 下の絵の演出にする
    const bg = gEl("", "gbig"); bg.style.background = g.effect === "galaxy" ? "radial-gradient(circle at 50% 45%,rgba(120,80,255,.55),rgba(10,6,30,.85) 70%)" : "radial-gradient(circle at 50% 40%,rgba(255,190,90,.35),rgba(20,10,40,.75) 70%)";
    if (vid) bg.style.background = "none";
    const cv = vid ? vid.el : g.effect === "galaxy" ? galaxy(6500) : starfall(6500);
    const el = gEl(`${vid ? "" : `<span class="gi">${ic}</span>`}<div class="gname"><em>${esc(it.nick)}</em> さんから ${esc(g.name)}！<span class="cbw">${comboTxt(it.combo)}</span></div>`, "gbig"); cbEl = el.querySelector(".cbw");
    let extra = 0, ext = 0; gNow = { key: it.key, bump: (n) => { setCombo(n); const d = Math.min(1500, EXTRA_MAX - ext); if (d > 0) { extra += d; ext += d; } } };
    await wait(vid ? Math.max(3000, vid.dur) : 6500); while (extra > 0) { const e = extra; extra = 0; await wait(e); }
    await gEnd([el, bg, cv], 0);
  }
  // 動画の演出：4秒以内に再生が始まらなければあきらめる（絵の演出に切り替え）
  function gVideo(url) {
    return new Promise((res) => {
      const v = document.createElement("video"); v.className = "gvid"; v.src = url; v.playsInline = true; v.preload = "auto";
      let done = false; const fin = (ok) => { if (done) return; done = true; if (!ok) { v.remove(); return res(null); } res({ el: v, dur: Math.min(15000, (v.duration || 6) * 1000) }); };
      v.addEventListener("playing", () => fin(true), { once: true }); v.addEventListener("error", () => fin(false), { once: true });
      setTimeout(() => fin(false), 4000);
      $("#gfx").appendChild(v);
      v.play().catch(() => { v.muted = true; v.play().catch(() => fin(false)); });
    });
  }
  // 粒の演出（キャンバス）。時間が来たら自分で止まる
  function canvasFx(ms, init, draw) {
    const cv = document.createElement("canvas"); cv.width = Math.round(GW); cv.height = Math.round(GH); $("#gfx").appendChild(cv);
    const x = cv.getContext("2d"); const P = init(); const t0 = performance.now();
    const step = (t) => { const k = (t - t0) / ms; if (k > 1.2 || !cv.isConnected) return; x.clearRect(0, 0, cv.width, cv.height); try { draw(x, P, k); } catch { return; } requestAnimationFrame(step); };
    requestAnimationFrame(step); return cv;
  }
  function sparkle(ms, cols, area) {
    return canvasFx(ms, () => Array.from({ length: 70 }, () => ({ x: GW / 2 + (Math.random() - 0.5) * Math.min(GW, 1600) * 0.56 * area, y: GH - 320 + (Math.random() - 0.5) * 300, vx: (Math.random() - 0.5) * 6, vy: -2 - Math.random() * 6, r: 3 + Math.random() * 6, c: cols[(Math.random() * cols.length) | 0] })),
      (x, P, k) => { for (const p of P) { p.x += p.vx; p.y += p.vy; p.vy += 0.08; x.globalAlpha = Math.max(0, 1 - k); x.fillStyle = p.c; x.beginPath(); x.arc(p.x, p.y, p.r, 0, 7); x.fill(); } });
  }
  function starfall(ms) {
    return canvasFx(ms, () => Array.from({ length: 90 }, () => ({ x: Math.random() * (GW + 480), y: -Math.random() * GH * 1.1, s: 8 + Math.random() * 16, l: 80 + Math.random() * 160 })),
      (x, P, k) => { x.globalAlpha = k > 0.85 ? Math.max(0, (1 - k) / 0.15) : 1; for (const p of P) { p.x -= p.s * 0.8; p.y += p.s; if (p.y > GH + 120) { p.y = -50; p.x = Math.random() * (GW + 480); }
        const g = x.createLinearGradient(p.x, p.y, p.x + p.l * 0.8, p.y - p.l); g.addColorStop(0, "rgba(255,240,180,1)"); g.addColorStop(1, "rgba(255,240,180,0)"); x.strokeStyle = g; x.lineWidth = 4; x.beginPath(); x.moveTo(p.x, p.y); x.lineTo(p.x + p.l * 0.8, p.y - p.l); x.stroke(); } });
  }
  function galaxy(ms) {
    return canvasFx(ms, () => Array.from({ length: 700 }, (_, i) => ({ a: Math.random() * Math.PI * 2, d: Math.pow(Math.random(), 0.6) * 900, arm: i % 3, r: 1 + Math.random() * 3, c: ["#c9b8ff", "#ff9ad5", "#8be3ff", "#ffffff"][i % 4] })),
      (x, P, k) => { const spin = k * 3; x.globalAlpha = k > 0.85 ? Math.max(0, (1 - k) / 0.15) : Math.min(1, k * 4);
        for (const p of P) { const a = p.a + spin * (1.2 - p.d / 1000) + p.arm * 2.09 + p.d / 260; const sx = Math.min(1, GW / 1920), sy = GH > GW ? 0.9 : 0.45, px = GW / 2 + Math.cos(a) * p.d * sx * Math.min(1, k * 3), py = GH * 0.46 + Math.sin(a) * p.d * sy * Math.min(1, k * 3); x.fillStyle = p.c; x.beginPath(); x.arc(px, py, p.r, 0, 7); x.fill(); } });
  }
  window.VBUI_CAT = (arr) => (arr || []).forEach((g) => (CAT[g.id] = g)); // お試し用：ギフトの一覧を外から渡す
  window.VBUI_GIFT = (gid, nick, combo) => giftIn({ body: `gift:${gid}:${combo || 1}`, nickname: nick || "テスト" }); // 確認用

  // ---- 届いたものを、届いた順に1つずつ処理する（同じものが2回届いても1回だけ） ----
  const seen = new Set(); let chain = Promise.resolve();
  function handleItems(items) {
    for (const c of items || []) {
      if (!c || seen.has(c.id)) continue; seen.add(c.id);
      if (c.id > after) after = c.id;
      chain = chain.then(() => handleOne(c)).catch(() => {});
    }
  }
  async function handleOne(c) {
    if (c.kind === "gift") { try { giftIn(c); } catch {} return; } // ギフトはコメントとは別の列で順番に出す
    if (c.kind === "test") {
      ack = c.id; kick(); // 「設定確認」はすぐ返事する
      banner("✅ Vぶいと接続できました", onecomme ? "わんコメにもテストのコメントを送りました" : "わんコメは見つかりませんでした（Vぶいの画面にコメントを表示します）");
      const sent = await ocSend(c); if (!sent) showComment(c);
      return;
    }
    if (c.kind === "rescue") { if (S.hero) hero(c); else await deliver(c, { cls: "hr", text: "🦸 救援に駆けつけました！" }); return; }
    await deliver(c); // ふつうのコメント・レイアウト確認の見本（sample）
  }
  function handleSettings(st, at) {
    if (!st) return;
    const changed = settingsAt !== undefined && at !== settingsAt;
    const ocBefore = S.oc;
    S = { ...S, ...st }; applySettings();
    if (S.oc === "no") onecomme = false; else if (ocBefore === "no" && OC) ocInit();
    if (changed) preview();
    settingsAt = at;
  }

  // ---- つなぎっぱなしの通知（新しいコメントは、届いた瞬間に出る） ----
  //  つながっている間は、Vぶいへの「生きてるよ」の連絡は30秒に1回だけ。つながらない時は、前と同じく2秒ごとに聞きに行く
  let rtOK = false;
  function realtime() {
    try {
      if (!window.supabase?.createClient) return;
      const cl = window.supabase.createClient(SB, PK, { auth: { persistSession: false, autoRefreshToken: false } });
      cl.channel("ovl:" + KEY, { config: { broadcast: { self: false } } })
        .on("broadcast", { event: "items" }, (m) => handleItems(m.payload?.items))
        .on("broadcast", { event: "settings" }, (m) => handleSettings(m.payload?.settings, m.payload?.settings_at))
        // 配信者が出入り禁止にした人のコメントは、画面からすぐ消す
        .on("broadcast", { event: "remove" }, (m) => { (m.payload?.ids || []).forEach((id) => { seen.add(id); document.querySelectorAll(`.cm[data-id="${Number(id)}"]`).forEach((el) => el.remove()); }); })
        .subscribe((status) => { const was = rtOK; rtOK = status === "SUBSCRIBED"; if (was && !rtOK) kick(); });
    } catch { rtOK = false; }
  }

  let timer = null;
  function kick() { clearTimeout(timer); timer = setTimeout(poll, 300); }
  async function poll() {
    clearTimeout(timer);
    try {
      const r = await fetch(SB + "/functions/v1/overlay", { method: "POST", headers: { apikey: PK, Authorization: "Bearer " + PK, "Content-Type": "application/json" },
        // after: 最初の1回は0（今あるコメントは出さない）。2回目からは、それより新しいものを受け取る（-1 = 最初はコメントが1つもなかった）
        body: JSON.stringify({ action: "poll", key: KEY, after: started ? (after || -1) : 0, onecomme: onecomme === true, ack }) });
      const d = await r.json();
      if (d.error === "bad_key") { err("Vぶい：このURLは使えなくなりました。Vぶいの設定画面から新しいURLをコピーしてください"); timer = setTimeout(poll, 30000); return; }
      if (!r.ok) throw new Error(d.error);
      err(""); failCount = 0;
      if (!started) { started = true; after = Math.max(after, d.last || 0); } // 最初の1回：これより前のコメントは出さない
      handleSettings(d.settings, d.settings_at);
      handleItems(d.items); // 通知を取りこぼした時の、念のための受け取り
    } catch { if (++failCount > 5) err("Vぶい：通信できません。インターネットの接続を確認してください"); }
    timer = setTimeout(poll, rtOK ? 30000 : 2000);
  }
  applySettings();
  if (!DEMO) { realtime(); ocInit().then(poll); }
  // わんコメが起動しているかを10秒ごとに確かめる
  //  ・閉じた → Vぶいのコメントは、この画面のすみっこに自動で出す
  //  ・また起動した → すみっこのコメントはすっと消して、また わんコメ（YouTubeのコメント）に混ぜて出す
  async function ocWatch() {
    if (!OC || S.oc === "no") return;
    const was = onecomme;
    try {
      const r = await fetch(OC_URL + "/api/services", { cache: "no-store" });
      const list = await r.json(); const arr = Array.isArray(list) ? list : (list.services || list.data || []);
      if (!q.get("ocsvc")) ocService = arr[0]?.id || ocService;
      onecomme = !!ocService;
    } catch { onecomme = false; }
    if (was === false && onecomme === true) clearStack();
  }
  function clearStack() {
    document.querySelectorAll("#stack .cm").forEach((el) => { el.classList.add("out"); setTimeout(() => el.remove(), 600); });
  }
  setInterval(ocWatch, 10000);

  // Vぶいが演出画面を新しくしたら、自動で読み込み直す（OBSを再起動しなくてOK）
  //  5分ごとに自分のページを見に行って、中身が変わっていたら、演出が出ていない時に読み込み直す
  let selfText = null;
  async function selfCheck() {
    try {
      const t = await (await fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" })).text();
      if (selfText === null) { selfText = t; return; }
      if (t !== selfText && t.includes("Vぶい 演出画面")) {
        const busy = () => heroBusy || gBusy || document.querySelector("#fx .banner") || document.querySelector("#stack .cm");
        const go = () => { if (busy()) return setTimeout(go, 5000); location.reload(); };
        go();
      }
    } catch {}
  }
  selfCheck(); setInterval(selfCheck, 5 * 60000);
})();
</script>
