<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vぶい 演出画面</title>
<style>
/* OBSのブラウザソース用。背景は透明。ふだんは何も表示しない（配信画面のレイアウトには一切さわらない） */
html,body{margin:0;background:transparent;overflow:hidden;width:100vw;height:100vh;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
/* 1920×1080 を基準に作って、OBSの画面サイズに合わせて縮める（720pでも1080pでも同じ見え方） */
#root{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
#stack{position:absolute;width:560px;display:flex;flex-direction:column;gap:10px}
#stack.bl{left:32px;bottom:32px;transform-origin:0 100%}
#stack.br{right:32px;bottom:32px;transform-origin:100% 100%;align-items:flex-end}
#stack.tl{left:32px;top:32px;transform-origin:0 0;flex-direction:column-reverse;justify-content:flex-end}
#stack.tr{right:32px;top:32px;transform-origin:100% 0;align-items:flex-end;flex-direction:column-reverse;justify-content:flex-end}
.cm{display:flex;gap:12px;align-items:flex-start;background:rgba(20,16,32,.82);color:#fff;border:2px solid #ff7ab8;border-radius:18px;padding:12px 16px;font-size:26px;line-height:1.45;box-shadow:0 6px 18px rgba(0,0,0,.35);animation:in .35s cubic-bezier(.2,.9,.3,1.2) both;max-width:100%;box-sizing:border-box;word-break:break-word}
#stack.br .cm,#stack.tr .cm{animation-name:inr}
.cm.out{animation:out .5s ease both}
.cm.pv{border-style:dashed;background:rgba(20,16,32,.6)}
.cm.hr{border-color:#ffc24a}
.cm img,.cm .av{width:44px;height:44px;border-radius:50%;flex:none;object-fit:cover;background:#2b2340;display:grid;place-items:center;font-weight:700;color:#ffc24a}
.cm b{display:block;font-size:18px;color:#ffb3d6}
.cm b i{font-style:normal;font-size:14px;background:#ff5fa8;color:#fff;border-radius:6px;padding:0 6px;margin-left:8px}
#fx{position:absolute;inset:0;display:grid;place-items:center}
.banner{background:linear-gradient(90deg,#ff5fa8,#3fb8f5);color:#fff;font-weight:900;font-size:64px;padding:26px 56px;border-radius:28px;box-shadow:0 10px 40px rgba(0,0,0,.4);text-align:center;animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}
.banner small{display:block;font-size:28px;font-weight:700;margin-top:6px;opacity:.95}
.banner.out{animation:out .6s ease both}
@keyframes in{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes inr{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateY(10px)}}
#err{position:absolute;left:24px;top:24px;background:#e5333d;color:#fff;font-size:22px;font-weight:700;border-radius:12px;padding:10px 16px;display:none}

/* ---- ギフトの演出（小：画面のすみ／中：やや大きく／大：全画面） ---- */
#groot{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
#gfx{position:absolute;inset:0;overflow:hidden}
#gfx canvas{position:absolute;inset:0;width:100%;height:100%}
.gvid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.gvid canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.cm.gf b i{background:#ff5fa8}
#gchips{position:absolute;right:40px;bottom:200px;display:flex;flex-direction:column-reverse;align-items:flex-end;gap:14px}
#gtop{position:absolute;inset:0}
/* 軽量モード（スマホの視聴画面）：重いぼかし・影を外す */
.lite .gb-beam,.lite .gb-shadow{filter:none}
.lite .gb-item img:not(.gold),.lite .gfloat,.lite .gms .gi,.lite .gphx b{filter:none}
.lite .gb-rays{-webkit-mask:none;mask:none;background:repeating-conic-gradient(rgba(255,230,150,.35) 0 7deg,transparent 7deg 18deg);width:900px;height:900px;margin-left:-450px;bottom:-80px;border-radius:50%}
.lite .gbox.charge .gb-body,.lite .gbox.gold.charge2 .gb-body{box-shadow:0 0 30px 8px rgba(255,220,120,.8)}
.lite .gb-beam,.lite .gb-halo,.lite .gring,.lite .gb-item .tw{display:none}
.lite .gflash{animation-duration:.4s}
.lite .gdim{background:rgba(0,0,0,.55)}
.lite .gchip.lv4,.lite .gchip.lv5,.lite .gchip.lv6,.lite .gchip.lv7,.lite .gchip.lv8,.lite .gchip.lv9{animation:none;background:rgba(25,15,40,.95);border:4px solid #ffd25e}
.lite .gbox-tx .g100{animation:none}
.gdim{position:absolute;inset:0;background:radial-gradient(circle at 50% 52%,rgba(40,20,60,.35),rgba(0,0,0,.72) 75%);animation:gfade .4s ease both}
.gbox{position:absolute;left:50%;top:56%;width:360px;height:300px;margin:-150px 0 0 -180px;animation:gbdrop .7s cubic-bezier(.3,1.6,.5,1) both}
.gbox.charge{animation:gbshake .14s linear infinite}
.gbox.open{animation:none}
.gb-shadow{position:absolute;left:20px;right:20px;bottom:-26px;height:30px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(10px)}
.gb-body{position:absolute;left:30px;right:30px;bottom:0;height:190px;border-radius:14px;background:linear-gradient(160deg,#ff8ec4 0%,#ff4f97 55%,#d9306f 100%);box-shadow:inset 0 -16px 0 rgba(0,0,0,.14),inset 0 10px 0 rgba(255,255,255,.18),0 18px 40px rgba(0,0,0,.4);transition:box-shadow .3s}
.gb-body i{position:absolute;left:50%;top:0;bottom:0;width:46px;margin-left:-23px;background:linear-gradient(90deg,#e8a800,#ffe9a8 45%,#ffd25e 60%,#e8a800)}
.gb-body em{position:absolute;left:14px;top:14px;width:40px;height:150px;border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0))}
.gbox.charge .gb-body{box-shadow:inset 0 -16px 0 rgba(0,0,0,.14),0 0 40px 10px rgba(255,220,120,.85),0 0 120px 30px rgba(255,200,80,.5)}
.gb-lid{position:absolute;left:12px;right:12px;bottom:180px;height:62px;border-radius:12px;background:linear-gradient(160deg,#ffa3cf,#ff5d9f 60%,#e63f82);box-shadow:0 8px 16px rgba(0,0,0,.25),inset 0 6px 0 rgba(255,255,255,.25);transform-origin:20% 100%;z-index:3}
.gb-lid i{position:absolute;left:50%;top:0;bottom:0;width:46px;margin-left:-23px;background:linear-gradient(90deg,#e8a800,#ffe9a8 45%,#ffd25e 60%,#e8a800)}
.gb-lid b{position:absolute;left:50%;top:-62px;width:130px;height:68px;margin-left:-65px;background:radial-gradient(ellipse at 25% 60%,#ffd25e 0 37%,#e8a800 38% 40%,transparent 41%),radial-gradient(ellipse at 75% 60%,#ffd25e 0 37%,#e8a800 38% 40%,transparent 41%),radial-gradient(circle at 50% 85%,#ffb000 0 14%,transparent 15%)}
.gbox.charge .gb-lid{box-shadow:0 0 30px 8px rgba(255,230,140,.9)}
.gbox.open .gb-lid{animation:gblid .9s cubic-bezier(.15,.8,.3,1) forwards}
.gb-item{position:absolute;left:50%;bottom:60px;width:460px;height:259px;margin-left:-230px;display:grid;place-items:center;opacity:0;transform:translateY(80px) scale(.2);z-index:2}
.gb-item img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 24px rgba(255,240,180,1)) drop-shadow(0 0 60px rgba(255,200,90,.8))}
.gb-item span{font-size:170px}
.gbox.open .gb-item{animation:gbitem 1s .1s cubic-bezier(.2,1.5,.4,1) forwards,gbbob 2.4s 1.2s ease-in-out infinite}
.gb-item .tw{position:absolute;font-style:normal;color:#fff6c8;text-shadow:0 0 12px #ffd25e,0 0 24px #ffb000;font-size:44px;opacity:0;animation:gtw 1.2s ease-in-out infinite}
.gb-item .tw:nth-of-type(1){left:2%;top:10%;animation-delay:1.1s}.gb-item .tw:nth-of-type(2){right:4%;top:4%;animation-delay:1.4s;font-size:34px}
.gb-item .tw:nth-of-type(3){left:12%;bottom:6%;animation-delay:1.7s;font-size:30px}.gb-item .tw:nth-of-type(4){right:10%;bottom:14%;animation-delay:1.3s}
.gb-item .tw:nth-of-type(5){left:46%;top:-14%;animation-delay:1.9s;font-size:36px}.gb-item .tw:nth-of-type(6){right:-4%;top:46%;animation-delay:1.6s;font-size:28px}
.gb-halo{position:absolute;left:50%;bottom:150px;width:520px;height:520px;margin-left:-260px;border-radius:50%;opacity:0;background:radial-gradient(circle,rgba(255,250,220,.95) 0,rgba(255,215,110,.55) 28%,rgba(255,150,60,0) 65%)}
.gbox.open .gb-halo{animation:gbhalo 4s .15s ease-out forwards}
.gb-rays{position:absolute;left:50%;bottom:-120px;width:1300px;height:1300px;margin-left:-650px;border-radius:50%;opacity:0;background:repeating-conic-gradient(rgba(255,230,150,.6) 0 7deg,transparent 7deg 18deg);-webkit-mask:radial-gradient(circle,#000 12%,transparent 62%);mask:radial-gradient(circle,#000 12%,transparent 62%)}
.gbox.open .gb-rays{animation:gbrays 4.4s linear forwards}
.gb-beam{position:absolute;left:50%;bottom:150px;width:220px;height:1200px;margin-left:-110px;transform-origin:50% 100%;opacity:0;background:linear-gradient(0deg,rgba(255,245,200,.9),rgba(255,220,130,.35) 50%,rgba(255,220,130,0));filter:blur(6px)}
.gbox.open .gb-beam{animation:gbbeam 1.6s ease-out forwards}
.gflash{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#fff 0,rgba(255,255,255,.85) 30%,rgba(255,240,200,0) 70%);animation:gflash .7s ease-out forwards;pointer-events:none}
.gring{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;border:10px solid rgba(255,230,150,.95);box-shadow:0 0 40px rgba(255,220,120,.9);animation:gring .9s ease-out forwards}
.gring.r2{border-color:rgba(255,140,200,.9);animation-delay:.15s;opacity:0}
.gbox-tx{position:absolute;left:0;right:0;top:calc(56% + 175px);display:flex;flex-direction:column;align-items:center;gap:2px;animation:gtxin .55s cubic-bezier(.2,1.6,.4,1) both;text-align:center}
.gbox-tx small{font-size:34px;font-weight:800;color:#fff;text-shadow:0 3px 10px rgba(0,0,0,.6)}
.gbox-tx small em{font-style:normal;color:#ffe27a}
.gbox-tx b{font-size:84px;font-weight:900;line-height:1.05;color:#fff6c8;-webkit-text-stroke:5px #c2185b;paint-order:stroke fill;text-shadow:0 0 30px rgba(255,200,80,.9);letter-spacing:.04em}
.gbox-tx span{font-size:38px;font-weight:900;color:#fff;background:linear-gradient(90deg,#ff5fa8,#8b6cff);border-radius:999px;padding:4px 28px;margin-top:4px}
/* 金（素材が届くまでは色で金にする） */
.gim{width:64px;height:40px;object-fit:contain;vertical-align:middle}
.gfloat .gim{width:80px;height:50px}
.gms .gi .gim{width:300px;height:180px}
img.gold,.gim.gold,#gdress .gdi.gold canvas{filter:grayscale(1) sepia(1) saturate(4) hue-rotate(2deg) brightness(1.45) contrast(1.15) drop-shadow(0 0 18px rgba(255,210,80,.9))}
.gdim.gold{background:radial-gradient(circle at 50% 52%,rgba(90,60,0,.35),rgba(0,0,0,.8) 75%)}
.gbox.gold{scale:1.25;transform-origin:50% 100%}
.gbox.gold .gb-body{background:linear-gradient(160deg,#fff3b0 0%,#ffd25e 40%,#d99a00 100%);box-shadow:inset 0 -16px 0 rgba(120,70,0,.25),inset 0 10px 0 rgba(255,255,255,.4),0 18px 40px rgba(0,0,0,.45)}
.gbox.gold .gb-lid{background:linear-gradient(160deg,#fff7cc,#ffd84a 55%,#e0a400)}
.gbox.gold .gb-body i,.gbox.gold .gb-lid i{background:linear-gradient(90deg,#b8002e,#ff4f7a 45%,#e0003a 60%,#b8002e)}
.gbox.gold .gb-lid b{background:radial-gradient(ellipse at 25% 60%,#ff3d6e 0 37%,#b8002e 38% 40%,transparent 41%),radial-gradient(ellipse at 75% 60%,#ff3d6e 0 37%,#b8002e 38% 40%,transparent 41%),radial-gradient(circle at 50% 85%,#ffd25e 0 14%,transparent 15%)}
.gbox.gold.charge2{animation:gbshake .08s linear infinite}
.gbox.gold.charge2 .gb-body{box-shadow:0 0 60px 20px rgba(255,230,120,1),0 0 200px 60px rgba(255,200,60,.7)}
.gbox.gold .gb-rays{background:repeating-conic-gradient(rgba(255,215,90,.75) 0 6deg,transparent 6deg 14deg)}
.gbox.gold .gb-halo{background:radial-gradient(circle,#fff 0,rgba(255,225,120,.75) 28%,rgba(255,170,0,0) 65%)}
.gbox.gold .gb-beam{width:360px;margin-left:-180px;background:linear-gradient(0deg,#fffbe0,rgba(255,215,90,.6) 50%,rgba(255,215,90,0))}
.gflash.gold{background:radial-gradient(circle,#fff 0,#fff6c8 35%,rgba(255,215,90,0) 75%);animation-duration:1.1s}
.gring.r3{border-color:rgba(255,210,80,.95);animation-delay:.3s;opacity:0}
.gring.r4{border-color:#fff;animation-delay:.45s;opacity:0}
.gbox-tx.gold b{font-size:104px;color:#ffe680;-webkit-text-stroke:7px #7a4a00;paint-order:stroke fill;text-shadow:0 0 30px rgba(255,210,80,1),0 6px 0 #5a3500}
.gbox-tx.gold span{background:linear-gradient(90deg,#ffb000,#ff5fa8)}
.gbox-tx .g100{font-style:normal;font-size:44px;font-weight:900;color:#fff;background:linear-gradient(90deg,#e0a400,#ffd25e,#e0a400);border-radius:999px;padding:4px 30px;margin-bottom:6px;animation:rbw 2s linear infinite;background-size:200% 100%}
.gbox.vid .gb-item{animation:gbitem 1s cubic-bezier(.2,1.5,.4,1) forwards,gbbob 2.4s 1.1s ease-in-out infinite}
@keyframes gbdrop{0%{opacity:0;transform:translateY(-520px) scale(.8)}70%{opacity:1;transform:translateY(0) scale(1.08,.92)}100%{transform:none}}
@keyframes gbshake{0%{transform:rotate(-4deg) translateX(-4px)}50%{transform:rotate(4deg) translateX(4px)}100%{transform:rotate(-4deg) translateX(-4px)}}
@keyframes gblid{0%{transform:none}100%{transform:translate(-260px,-520px) rotate(-200deg);opacity:0}}
@keyframes gbitem{0%{opacity:0;transform:translateY(80px) scale(.2)}60%{opacity:1;transform:translateY(-290px) scale(1.85)}100%{opacity:1;transform:translateY(-250px) scale(1.6)}}
@keyframes gbbob{0%,100%{translate:0 0}50%{translate:0 -14px}}
@keyframes gtw{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(45deg)}}
@keyframes gbhalo{0%{opacity:0;transform:translateY(-220px) scale(.3)}25%{opacity:1;transform:translateY(-220px) scale(1.15)}100%{opacity:.75;transform:translateY(-220px) scale(1)}}
@keyframes gbbeam{0%{opacity:0;transform:scaleY(.1)}25%{opacity:1;transform:scaleY(1)}100%{opacity:0;transform:scaleY(1) scaleX(1.6)}}
@keyframes gflash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
@keyframes gring{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(7)}}
@keyframes gtxin{from{opacity:0;transform:scale(2.2)}to{opacity:1;transform:none}}
@keyframes gbrays{0%{opacity:0;transform:rotate(0)}12%{opacity:1}100%{opacity:.8;transform:rotate(80deg)}}
#gdress{position:absolute;inset:0}
#gdress .gdi{position:absolute;transform:translate(-50%,-50%);aspect-ratio:16/9}
#gdress .gdi canvas{width:100%;height:100%;display:block}
#gtop canvas{position:absolute;inset:0;width:100%;height:100%}
.gchip{position:relative;animation:inr .35s ease both;display:flex;align-items:center;gap:14px;background:rgba(20,16,32,.86);color:#fff;border:3px solid #ff7ab8;border-radius:999px;padding:10px 26px 10px 12px;font-size:30px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:inr .4s ease both}
.gchip .gi{font-size:56px;line-height:1}
.gchip small{display:block;font-size:20px;font-weight:700;color:#ffb3d6}
.gchip .cb{font-size:40px;color:#ffd25e;font-weight:900;margin-left:6px}
.gchip .cb:empty{display:none}
.gchip .cb.hit{animation:cbhit .25s ease-out}
@keyframes cbhit{from{transform:scale(1.5)}to{transform:none}}
/* 100コンボごとに札が豪華に */
.gchip.lv1{border-color:#ff5fa8;box-shadow:0 0 24px rgba(255,95,168,.7)}
.gchip.lv1 .cb{font-size:48px}
.gchip.lv2,.gchip.lv3{border-color:#ffd25e;background:linear-gradient(90deg,rgba(60,40,10,.92),rgba(30,20,40,.9));box-shadow:0 0 30px rgba(255,210,94,.8)}
.gchip.lv2 .cb,.gchip.lv3 .cb{font-size:56px;color:#fff3b0;text-shadow:0 0 14px #ffb347}
.gchip.lv3{transform:scale(1.08);transform-origin:right center}
.gchip.lv4,.gchip.lv5,.gchip.lv6,.gchip.lv7,.gchip.lv8,.gchip.lv9{border:4px solid transparent;background:linear-gradient(rgba(25,15,40,.95),rgba(25,15,40,.95)) padding-box,linear-gradient(90deg,#ff5fa8,#ffd25e,#8be3ff,#b6ff8a,#ff5fa8) border-box;background-size:auto,300% 100%;animation:rbw 1.6s linear infinite;box-shadow:0 0 40px rgba(255,255,255,.5);transform:scale(1.15);transform-origin:right center}
.gchip.lv6,.gchip.lv7,.gchip.lv8,.gchip.lv9{transform:scale(1.25)}
.gchip.lv4 .cb,.gchip.lv5 .cb,.gchip.lv6 .cb,.gchip.lv7 .cb,.gchip.lv8 .cb,.gchip.lv9 .cb{font-size:64px;background:linear-gradient(90deg,#ff5fa8,#ffd25e,#8be3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes rbw{to{background-position:0 0,300% 0}}
.gms{position:absolute;left:0;right:0;top:22%;display:flex;flex-direction:column;align-items:center;gap:6px;animation:gmsin .5s cubic-bezier(.2,1.6,.4,1) both;text-align:center}
.gms .gi{font-size:180px;line-height:1;filter:drop-shadow(0 0 40px rgba(255,210,94,.9))}
.gms b{font-size:120px;font-weight:900;color:#fff;-webkit-text-stroke:6px #ff5fa8;paint-order:stroke fill;text-shadow:0 8px 30px rgba(0,0,0,.4);line-height:1.05}
.gms.lv2 b,.gms.lv3 b{-webkit-text-stroke-color:#d98b00;color:#fff3b0}
.gms.lv4 b,.gms.lv5 b,.gms.lv6 b,.gms.lv7 b,.gms.lv8 b,.gms.lv9 b{font-size:150px;-webkit-text-stroke-color:#7a3cff;background:linear-gradient(90deg,#ff5fa8,#ffd25e,#8be3ff,#b6ff8a);-webkit-background-clip:text;background-clip:text;color:transparent}
.gms small{font-size:36px;font-weight:800;color:#fff;background:rgba(20,16,32,.8);border-radius:999px;padding:6px 26px}
@keyframes gmsin{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
.gphx-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(255,120,30,.45),rgba(60,5,10,.85) 70%);animation:gfade .8s ease both}
.gphx{position:absolute;left:0;right:0;bottom:8%;display:flex;flex-direction:column;align-items:center;gap:10px;animation:gmsin .8s 1.2s cubic-bezier(.2,1.4,.4,1) both}
.gphx b{font-size:170px;font-weight:900;letter-spacing:.08em;color:#fff3b0;-webkit-text-stroke:6px #b33000;paint-order:stroke fill;text-shadow:0 0 40px rgba(255,150,40,.9)}
.gphx small{font-size:44px;font-weight:800;color:#fff;background:linear-gradient(90deg,#ff7a1a,#ff2d55);border-radius:999px;padding:10px 40px}
.gphx em{font-style:normal;color:#ffe27a}
.gfloat{position:absolute;font-size:72px;animation:gfl 2.6s ease-out forwards}
@keyframes gfl{from{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1}to{opacity:0;transform:translateY(-520px) scale(1.2)}}
.gmid{position:absolute;left:0;right:0;bottom:150px;display:flex;flex-direction:column;align-items:center;gap:8px;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.gmid .gi{font-size:200px;line-height:1;filter:drop-shadow(0 10px 30px rgba(255,111,163,.6));animation:gbob 1s ease-in-out infinite alternate}
@keyframes gbob{to{transform:translateY(-14px) rotate(4deg)}}
.gname{background:linear-gradient(90deg,#ff5fa8,#8b6cff);color:#fff;font-weight:900;font-size:44px;border-radius:999px;padding:10px 34px;box-shadow:0 8px 30px rgba(0,0,0,.35);white-space:nowrap}
.gname em{font-style:normal;color:#ffe27a}
.gname .cb{color:#ffe27a;margin-left:10px}
.gbig{position:absolute;inset:0;display:grid;place-items:center;animation:gfade .6s ease both}
.gbig .gi{font-size:380px;line-height:1;filter:drop-shadow(0 0 60px rgba(160,140,255,.9));animation:gzoom 5.5s ease-out both}
@keyframes gzoom{from{transform:scale(.3) rotate(-20deg);opacity:0}15%{transform:scale(1.15) rotate(4deg);opacity:1}25%{transform:scale(1)}to{transform:scale(1.08)}}
.gbig .gname{position:absolute;bottom:130px;font-size:64px;padding:16px 48px}
@keyframes gfade{from{opacity:0}to{opacity:1}}
.gout{animation:out .6s ease both!important}
/* ---- 救援ヒーロー（救援通知から駆けつけたリスナーさんの登場演出） ---- */
.hero{position:absolute;left:0;top:0;width:120px;height:120px;will-change:transform}
.hero .hb{position:absolute;inset:0}
.hero .cape{position:absolute;left:-58px;top:22px;width:120px;height:96px;transform-origin:100% 20%}
.hero.l .cape{left:58px;transform:scaleX(-1);transform-origin:50% 20%}
.hero.fly .cape{animation:flap .18s ease-in-out infinite alternate}
.hero.walk .cape{animation:flap .35s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleY(.82) rotate(-6deg)}}
.hero.l.fly .cape,.hero.l.walk .cape{animation-name:flapl}
@keyframes flapl{from{transform:scaleX(-1)}to{transform:scaleX(-1) scaleY(.82) rotate(-6deg)}}
.hero .face{position:absolute;inset:8px;border-radius:50%;border:5px solid #fff;background:#2b2340;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.4);display:grid;place-items:center;color:#ffc24a;font-weight:900;font-size:44px}
.hero .face img{width:100%;height:100%;object-fit:cover}
.hero .emb{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);background:#ffc24a;color:#2b2340;font-weight:900;font-size:18px;border-radius:8px;padding:0 8px;border:3px solid #fff;white-space:nowrap}
.hero.walk .hb{animation:bob .3s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-12px) rotate(4deg)}}
.hero .tag{position:absolute;bottom:132px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff;color:#2b2340;font-weight:900;font-size:24px;border-radius:14px;padding:6px 14px;box-shadow:0 4px 12px rgba(0,0,0,.3);opacity:0;transition:opacity .25s}
.hero .tag em{font-style:normal;color:#ff5fa8}
.hero.named .tag{opacity:1}
.puff{position:absolute;width:140px;height:40px;border-radius:50%;background:radial-gradient(rgba(255,255,255,.9),rgba(255,255,255,0) 70%);animation:puff .5s ease-out both}
@keyframes puff{from{opacity:1;transform:scale(.4)}to{opacity:0;transform:scale(1.6)}}
</style>
</head>
<body>
<div id="groot"><div id="gdress"></div><div id="gfx"></div><div id="gchips"></div><div id="gtop"></div></div><div id="root"><div id="stack" class="bl"></div><div id="fx"></div></div>
<div id="err"></div>
<script>if (!/[?&]demo=1/.test(location.search)) document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"><\/script>');</script>
<script>
(() => {
  const SB = "https://sgmzyhvhwbqyudayboes.supabase.co";
  const PK = "sb_publishable_igtK18JrLPQCoKbF0U03Gg_o8fKrApc";
  const q = new URLSearchParams(location.search);
  const KEY = q.get("k") || "";
  const DEMO = q.get("demo") === "1";              // Vぶいの視聴画面でのお試し（演出だけ。どこにもつながない）
  const OC = q.get("oc") !== "0";                 // わんコメにも流す（初期はオン）
  const OC_URL = q.get("ocurl") || "http://localhost:11180";
  const SHOW_URL = q.get("show");                 // URLで指定があればそれを優先（"1"/"0"）
  const W = 1920, H = 1080;
  let started = false, after = 0, ack = null, onecomme = null, ocService = q.get("ocsvc") || null, failCount = 0;
  let S = { pos: "bl", size: "m", show: "auto", side: "r", hero: true, oc: "" }, settingsAt = undefined;
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const err = (t) => { const e = $("#err"); e.textContent = t; e.style.display = t ? "block" : "none"; };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  // 画面サイズに合わせて 1920×1080 の座標を縮める
  function fit() {
    const s = Math.min(innerWidth / W, innerHeight / H) || 1, r = $("#root");
    r.style.width = innerWidth / s + "px"; r.style.height = innerHeight / s + "px"; r.style.transform = `scale(${s})`;
  }
  // ギフトの演出は、横長なら1920×1080、縦長なら1080×1920として描く（短い辺を1080にそろえる。1つの演出で縦横どちらにも合う）
  let GW = 1920, GH = 1080;
  function gfit() {
    const port = innerHeight > innerWidth, bw = port ? 1080 : 1920, bh = port ? 1920 : 1080;
    const s = Math.min(innerWidth / bw, innerHeight / bh) || 1, r = $("#groot");
    GW = innerWidth / s; GH = innerHeight / s; r.style.width = GW + "px"; r.style.height = GH + "px"; r.style.transform = `scale(${s})`;
  }
  addEventListener("resize", () => { fit(); gfit(); }); fit(); gfit();
  // 軽量モード：視聴画面の小さな枠（スマホ）では、粒の数・ぼかしを減らし、キャンバスも表示サイズに合わせて小さく作る（iPhoneで落ちないように）
  const LITE = DEMO || innerWidth < 900; if (LITE) document.documentElement.classList.add("lite");
  let CV_LIVE = 0;
  function mkCv(parent) {
    if (LITE && CV_LIVE >= 2) { const d = document.createElement("canvas"); d.width = d.height = 1; (parent || $("#gfx")).appendChild(d); return { cv: d, x: d.getContext("2d"), dummy: true }; }   // 同時に描く粒の画面は2枚まで
    CV_LIVE++; const cs = Math.min(1, (innerWidth * Math.min(devicePixelRatio || 1, 2)) / GW);
    const cv = document.createElement("canvas"); cv.width = Math.max(1, Math.round(GW * cs)); cv.height = Math.max(1, Math.round(GH * cs)); (parent || $("#gfx")).appendChild(cv);
    new MutationObserver((_, ob) => { if (!cv.isConnected) { CV_LIVE--; cv.width = cv.height = 1; ob.disconnect(); } }).observe(cv.parentNode, { childList: true });
    const x = cv.getContext("2d"); x.setTransform(cs, 0, 0, cs, 0, 0); return { cv, x };
  }
  const vw = () => $("#root").offsetWidth, vh = () => $("#root").offsetHeight;

  function applySettings() {
    const st = $("#stack"); st.className = S.pos;
    st.style.transform = `scale(${{ s: 0.75, m: 1, l: 1.3 }[S.size] || 1})`;
  }
  // わんコメを使わない人（oc=no）は、いつもこの画面にコメントを出す
  const showMode = () => SHOW_URL === "1" ? "on" : SHOW_URL === "0" ? "off" : S.oc === "no" ? "on" : S.show;

  if (!KEY && !DEMO) { err("Vぶい：URLにカギ（k=…）がありません。Vぶいの設定画面からURLをコピーし直してください"); return; }

  // ---- わんコメ（配信者さんのPCで動いているコメントツール）に、Vぶいのコメントを混ぜる ----
  async function ocInit() {
    if (!OC) { onecomme = false; return; }
    try {
      if (!ocService) {
        const r = await fetch(OC_URL + "/api/services", { cache: "no-store" });
        const list = await r.json();
        const arr = Array.isArray(list) ? list : (list.services || list.data || []);
        ocService = arr[0]?.id || null;
      }
      onecomme = !!ocService;
    } catch { onecomme = false; }
  }
  async function ocSend(c, text) {
    if (!onecomme) return false;
    try {
      const r = await fetch(OC_URL + "/api/comments", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
        service: { id: ocService },
        comment: { id: "vbui-" + c.id, userId: "vbui-" + (c.nickname || ""), name: (c.nickname || "Vぶい") + " ［Vぶい］", comment: text ?? c.body, profileImage: c.avatar_url || "https://vvbuibui.com/icon-192.png", badges: [{ label: "Vぶい", url: "https://vvbuibui.com/icon-192.png" }], hasGift: false, isOwner: false, timestamp: Date.parse(c.created_at) || Date.now() },
      }) });
      return r.ok;
    } catch { onecomme = false; return false; }
  }

  // ---- この画面に直接コメントを出す（わんコメを使っていない人向け／設定で「いつも出す」の人） ----
  function showComment(c, { cls = "", text, ms = 15000 } = {}) {
    const el = document.createElement("div"); el.className = "cm " + cls; if (c.id) el.dataset.id = c.id;
    el.innerHTML = `${c.avatar_url ? `<img src="${esc(c.avatar_url)}" alt="">` : `<span class="av">${esc([...(c.nickname || "V")][0])}</span>`}<div><b>${esc(c.nickname)}<i>Vぶい</i></b>${esc(text ?? c.body)}</div>`;
    const st = $("#stack"); st.appendChild(el);
    while (st.children.length > 5) st.firstChild.remove();
    setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 600); }, ms);
  }
  // わんコメ優先、なければこの画面に（設定に従う）
  async function deliver(c, opt = {}) {
    const mode = showMode();
    const sent = mode === "on" ? false : await ocSend(c, opt.text);
    if (mode === "on" || (!sent && mode !== "off")) showComment(c, opt);
  }
  // 設定を変えた直後：どこに出るかを数秒だけ見せる
  function preview() {
    const mode = showMode();
    const sample = { nickname: "表示位置の確認", body: mode === "off" ? "（この画面にはコメントを出さない設定です）" : "Vぶいのコメントはここに出ます" };
    showComment(sample, { cls: "pv", ms: 6000 });
  }

  // ---- 演出（ギフトなどは今後ここに追加） ----
  function banner(title, sub, ms = 5000) {
    const fx = $("#fx"); const b = document.createElement("div"); b.className = "banner";
    b.innerHTML = `${esc(title)}${sub ? `<small>${esc(sub)}</small>` : ""}`; fx.innerHTML = ""; fx.appendChild(b);
    setTimeout(() => { b.classList.add("out"); setTimeout(() => b.remove(), 700); }, ms);
  }
  window.VBUI_EFFECT = (type, data) => { /* ギフト演出の入口（準備中） */ banner(data?.title || "🎁", data?.sub || "", 4000); };

  // ---- 救援ヒーロー：画面の端に小さく飛んできて、着地、とことこ歩いてコメント欄の方へ飛び込む ----
  const CAPE = `<svg class="cape" viewBox="0 0 120 96"><path d="M118 6 C80 0 40 10 4 30 C18 44 10 66 0 92 C40 80 78 60 118 40 Z" fill="#ff5fa8"/><path d="M118 6 C84 4 52 14 22 30 C34 40 30 58 24 76 C56 62 88 48 118 40 Z" fill="#ff8cc4"/></svg>`;
  const heroQ = []; let heroBusy = false;
  function hero(c) { if (heroQ.length < 6) heroQ.push(c); if (!heroBusy) heroNext(); }
  async function heroNext() {
    const c = heroQ.shift(); if (!c) { heroBusy = false; return; }
    heroBusy = true;
    try { await heroPlay(c); } catch {}
    await wait(300); heroNext();
  }
  async function heroPlay(c) {
    // わんコメを使わない人は、コメントを出している側（四隅の左右）に飛び込む
    const side = S.oc === "no" ? (S.pos[1] === "l" ? "l" : "r") : S.side;
    const R = side === "r", dir = R ? 1 : -1, w = vw(), h = vh(), size = 120;
    const el = document.createElement("div"); el.className = "hero fly" + (R ? "" : " l");
    const face = c.avatar_url ? `<img src="${esc(c.avatar_url)}" alt="">` : esc([...(c.nickname || "V")][0]);
    el.innerHTML = `<div class="hb">${CAPE}<div class="face">${face}</div><span class="emb">救援</span></div><div class="tag"><em>${esc(c.nickname)}</em> さんが救援にきた！</div>`;
    $("#root").appendChild(el);
    const landX = R ? w - 560 : 560 - size, landY = Math.round(h * 0.56);
    const startX = landX - dir * 520, startY = -180;
    const edgeX = R ? w - size - 24 : 24, outX = R ? w + 60 : -size - 60;
    const T = (x, y, rot = 0, sc = 1) => `translate(${x}px,${y}px) rotate(${rot}deg) scale(${sc})`;
    // 1) 斜め上から飛んでくる
    await el.animate([{ transform: T(startX, startY, dir * 35, 0.8) }, { transform: T(landX - dir * 60, landY - 40, dir * 15, 1) }, { transform: T(landX, landY, 0, 1) }], { duration: 1000, easing: "cubic-bezier(.3,.7,.4,1)", fill: "forwards" }).finished;
    // 2) 着地（ぽよん＋けむり）
    const puff = document.createElement("div"); puff.className = "puff"; puff.style.left = landX - 10 + "px"; puff.style.top = landY + size - 24 + "px"; $("#root").appendChild(puff); setTimeout(() => puff.remove(), 600);
    el.classList.remove("fly");
    await el.animate([{ transform: T(landX, landY) + " scale(1.15,.82)" }, { transform: T(landX, landY - 18) + " scale(.95,1.06)" }, { transform: T(landX, landY) }], { duration: 380, easing: "ease-out", fill: "forwards" }).finished;
    // 3) 名前を出して、とことこ歩く
    el.classList.add("named", "walk");
    await wait(500);
    await el.animate([{ transform: T(landX, landY) }, { transform: T(edgeX, landY) }], { duration: Math.max(1400, Math.abs(edgeX - landX) * 5.2), easing: "linear", fill: "forwards" }).finished;
    // 4) ぴょんっとコメント欄へ飛び込む
    el.classList.remove("walk", "named");
    await el.animate([{ transform: T(edgeX, landY) }, { transform: T((edgeX + outX) / 2, landY - 90, dir * 20, 0.85) }, { transform: T(outX, landY - 20, dir * 40, 0.5), opacity: 0.6 }], { duration: 620, easing: "ease-in", fill: "forwards" }).finished;
    el.remove();
    await deliver(c, { cls: "hr", text: "🦸 救援に駆けつけました！" });
  }
  window.VBUI_HERO = hero; // 確認用

  // ===== ギフト演出 =====
  //  ・演出でエラーが起きても、ここで止める（配信やほかの表示には影響させない）
  //  ・たくさん届いたら順番に出す。たまりすぎたら古い小さいギフトから間引く
  //  ・同じ人の同じギフトの連打は「×N」にまとめる
  //  ・素材が出せないときは、名前の帯だけ出す
  let CAT = {};
  const SES = new Map();                  // 連打のまとまり（同じ人×同じギフト）＝右下の「コンボ札」
  const CHIP_MAX = LITE ? 2 : 4, SES_MAX = LITE ? 8 : 30, COMBO_GAP = 3500;   // 札は同時に4枚まで。3秒（＋通信の遅れ）押さなければコンボ終了
  const FXQ = []; let fxBusy = false; const FXQ_MAX = LITE ? 2 : 10;  // 中・大ギフトの演出は1つずつ順番に
  async function loadCatalog() {
    try { const r = await fetch(SB + "/rest/v1/gift_catalog?select=id,name,price,tier,effect,icon", { headers: { apikey: PK, Authorization: "Bearer " + PK } }); const a = await r.json(); if (Array.isArray(a)) a.forEach((g) => (CAT[g.id] = g)); } catch {}
  }
  loadCatalog(); setInterval(loadCatalog, 10 * 60e3);
  // 「出ました」「出せませんでした」をVぶいに知らせる（出せなかった分は視聴者に返金される）。まとめて送り、失敗したらもう一度
  const ACK = { shown: [], dropped: [] }; let ackTry = 0;
  const ackIds = (ids, kind) => { if (!KEY) return; ids.forEach((id) => Number.isFinite(id) && ACK[kind].push(id)); };
  setInterval(async () => {
    if (!ACK.shown.length && !ACK.dropped.length) return;
    const b = { shown: ACK.shown.splice(0, 100), dropped: ACK.dropped.splice(0, 100) };
    try { const r = await fetch(SB + "/functions/v1/gift", { method: "POST", headers: { apikey: PK, Authorization: "Bearer " + PK, "Content-Type": "application/json" }, body: JSON.stringify({ action: "shown", key: KEY, ...b }) }); if (!r.ok) throw 0; ackTry = 0; }
    catch { if (++ackTry < 20) { ACK.shown.unshift(...b.shown); ACK.dropped.unshift(...b.dropped); } }
  }, 1500);
  const gLine = (c, g, n) => { try { deliver({ ...c, id: (c.id || "x") + "-" + n }, { cls: "gf", text: `🎁 ${g.name}を贈りました${n > 1 ? ` ×${n}` : ""}` }); } catch {} };
  function gEl(html, cls, parent) { const el = document.createElement("div"); el.className = cls; el.innerHTML = html; (parent || $("#gfx")).appendChild(el); return el; }
  async function gEnd(els, ms) { await wait(ms); els.forEach((e) => e && e.classList.add("gout")); await wait(600); els.forEach((e) => e && e.remove()); }
  const lvOf = (n) => Math.min(9, Math.floor(n / 100));   // 100コンボごとに札が豪華になる

  const gIc = (g) => (g.img ? `<img class="gim${g.gold ? " gold" : ""}" src="${esc(g.img)}" alt="">` : esc(g.icon || "🎁"));   // 絵（着せ替えのサムネ）か絵文字
  function giftIn(c) {
    const id = Number(c.id);
    if (c.created_at && Date.now() - Date.parse(c.created_at) > 60e3) { ackIds([id], "dropped"); return; } // つながり直したときの古いギフトは出さない（返金）
    const [, gid, cb] = String(c.body || "").split(":"); const combo = Number(cb) || 1;
    const g = CAT[gid] || { id: gid, name: "ギフト", tier: "small", effect: "", icon: "🎁" };
    const nick = c.nickname || "リスナー", key = nick + "|" + gid;
    const cur = SES.get(key);
    if (cur) { cur.ids.push(id); if (cur.chip) ackIds([id], "shown"); cur.bump(combo); return; }
    if (SES.size >= SES_MAX) {                                     // たまりすぎ：まだ出ていない一番古いものを返金して捨てる
      const old = [...SES.values()].find((x) => !x.chip); if (old) { ackIds(old.ids, "dropped"); SES.delete(old.key); }
      else { ackIds([id], "dropped"); return; }
    }
    const s = session(key, g, nick, id, combo); SES.set(key, s);
    gLine(c, g, combo);                                            // コメント欄：始まりに1回、連打なら終わりに「×N」でもう1回
    if (g.tier !== "small") { if (FXQ.length >= FXQ_MAX) FXQ.shift(); FXQ.push(s); if (!fxBusy) fxNext(); }
    chips();
  }
  function session(key, g, nick, id, combo) {
    const s = { key, g, nick, ids: [id], combo, chip: null, t: 0, lastBurst: 0 };
    s.paint = () => { if (!s.chip) return; const lv = lvOf(s.combo); s.chip.className = "gchip lv" + lv; s.chip.querySelector(".cb").textContent = s.combo > 1 ? "×" + s.combo : "";
      const cb = s.chip.querySelector(".cb"); cb.classList.remove("hit"); void cb.offsetWidth; cb.classList.add("hit"); };
    s.bump = (n) => {
      if (n <= s.combo) return; const old = s.combo; s.combo = n; s.paint();
      if (s.chip) { clearTimeout(s.t); s.t = setTimeout(() => endSes(s), COMBO_GAP); if (Date.now() - s.lastBurst > (LITE ? 700 : 350)) { s.lastBurst = Date.now(); floatBurst(s); } }
      if (Math.floor(n / 100) > Math.floor(old / 100) && !(old < 1000 && n >= 1000)) { try { milestone(s, Math.floor(n / 100) * 100); } catch {} }   // 100, 200, 300…
      if (old < 1000 && n >= 1000) { try { phoenix(s); } catch {} }                                                   // 1000で鳳凰
    };
    return s;
  }
  function endSes(s) {
    SES.delete(s.key);
    if (s.combo > 1) gLine({ id: s.ids[0], nickname: s.nick }, s.g, s.combo);
    const el = s.chip; s.chip = null; if (el) { el.classList.add("gout"); setTimeout(() => { el.remove(); chips(); }, 600); } else chips();
  }
  // 右下の札：同時に4枚まで。空いたら順番待ちのものを出す
  function chips() {
    const on = [...SES.values()].filter((x) => x.chip);
    for (const s of SES.values()) {
      if (on.length >= CHIP_MAX) break; if (s.chip) continue;
      s.chip = gEl(`<span class="gi">${gIc(s.g)}</span><span class="tx"><small>${esc(s.nick)} さんから</small>${esc(s.g.name)}</span><span class="cb"></span>`, "gchip", $("#gchips"));
      s.paint(); ackIds(s.ids, "shown"); floatBurst(s); s.lastBurst = Date.now(); s.t = setTimeout(() => endSes(s), COMBO_GAP + 600); on.push(s);
    }
  }
  function floatBurst(s) {
    if ($("#gfx").querySelectorAll(".gfloat").length > (LITE ? 12 : 40)) return;     // 浮かぶアイコンは40個まで（連打でも重くならない）
    const k = s.combo >= 100 ? 5 : 3;
    for (let i = 0; i < k; i++) { const f = gEl(gIc(s.g), "gfloat"); f.style.right = 60 + Math.random() * 420 + "px"; f.style.bottom = 260 + Math.random() * 80 + "px"; f.style.animationDelay = i * 0.1 + "s"; setTimeout(() => f.remove(), 3200); }
  }
  // 100コンボごとの「ドン！」：真ん中に大きく。次が来たら入れ替え
  let msEl = null, msCv = null;
  function milestone(s, n) {
    msEl?.remove(); msCv?.remove();
    const lv = lvOf(n), cols = lv >= 5 ? ["#ffffff", "#ffd25e", "#ff7ab8", "#8be3ff", "#b6ff8a"] : lv >= 2 ? ["#ffd25e", "#ffb347", "#fff2b0"] : ["#ff7ab8", "#ffd25e", "#ffffff"];
    msCv = sparkle(2600, cols, 1 + lv * 0.15);
    msEl = gEl(`<span class="gi">${gIc(s.g)}</span><b>${n.toLocaleString("ja-JP")}コンボ！</b><small>${esc(s.nick)} さんの ${esc(s.g.name)}</small>`, "gms lv" + lv);
    const a = msEl, b = msCv; setTimeout(() => gEnd([a, b], 0), 2400);
  }
  // 中・大ギフトの演出（1回のまとまりにつき1回。数は札が数える）
  async function fxNext() {
    const s = FXQ.shift(); if (!s) { fxBusy = false; return; }
    fxBusy = true;
    try { await gPlay(s); } catch { try { await gFallback(s); } catch {} }
    await wait(250); fxNext();
  }
  async function gFallback(s) { const el = gEl(`<div class="gname"><em>${esc(s.nick)}</em> さんから ${esc(s.g.name)}</div>`, "gmid"); await gEnd([el], 3500); }
  // ---- 着せ替えが贈られた：画面中央でプレゼントボックスが開いて、アイテムが出てくる ----
  let DCAT = null, DSET = {};
  let DCATP = null;
  function dressCat() { return DCAT ? Promise.resolve(DCAT) : (DCATP ||= dressCat0()); }   // 連打しても読み込みは1回だけ

  }
  function galaxy(ms) {
    return canvasFx(ms, () => Array.from({ length: 700 }, (_, i) => ({ a: Math.random() * Math.PI * 2, d: Math.pow(Math.random(), 0.6) * 900, arm: i % 3, r: 1 + Math.random() * 3, c: ["#c9b8ff", "#ff9ad5", "#8be3ff", "#ffffff"][i % 4] })),
      (x, P, k) => { const spin = k * 3; x.globalAlpha = k > 0.85 ? Math.max(0, (1 - k) / 0.15) : Math.min(1, k * 4);
        for (const p of P) { const a = p.a + spin * (1.2 - p.d / 1000) + p.arm * 2.09 + p.d / 260; const sx = Math.min(1, GW / 1920), sy = GH > GW ? 0.9 : 0.45, px = GW / 2 + Math.cos(a) * p.d * sx * Math.min(1, k * 3), py = GH * 0.46 + Math.sin(a) * p.d * sy * Math.min(1, k * 3); x.fillStyle = p.c; x.beginPath(); x.arc(px, py, p.r, 0, 7); x.fill(); } });
  }
  window.VBUI_CAT = (arr) => (arr || []).forEach((g) => (CAT[g.id] = g)); // お試し用：ギフトの一覧を外から渡す
  window.VBUI_GIFT = (gid, nick, combo) => giftIn({ body: `gift:${gid}:${combo || 1}`, nickname: nick || "テスト" }); // 確認用

  // ---- 届いたものを、届いた順に1つずつ処理する（同じものが2回届いても1回だけ） ----
  const seen = new Set(); let chain = Promise.resolve();
  function handleItems(items) {
    for (const c of items || []) {
      if (!c || seen.has(c.id)) continue; seen.add(c.id);
      if (c.id > after) after = c.id;
      chain = chain.then(() => handleOne(c)).catch(() => {});
    }
  }
  async function handleOne(c) {
    if (c.kind === "gift") { try { giftIn(c); } catch {} return; } // ギフトはコメントとは別の列で順番に出す
    if (c.kind === "test") {
      ack = c.id; kick(); // 「設定確認」はすぐ返事する
      banner("✅ Vぶいと接続できました", onecomme ? "わんコメにもテストのコメントを送りました" : "わんコメは見つかりませんでした（Vぶいの画面にコメントを表示します）");
      const sent = await ocSend(c); if (!sent) showComment(c);
      return;
    }
    if (c.kind === "rescue") { if (S.hero) hero(c); else await deliver(c, { cls: "hr", text: "🦸 救援に駆けつけました！" }); return; }
    await deliver(c); // ふつうのコメント・レイアウト確認の見本（sample）
  }
  function handleSettings(st, at) {
    if (!st) return;
    const changed = settingsAt !== undefined && at !== settingsAt;
    const ocBefore = S.oc;
    S = { ...S, ...st }; applySettings();
    if (S.oc === "no") onecomme = false; else if (ocBefore === "no" && OC) ocInit();
    if (changed) preview();
    settingsAt = at;
  }

  // ---- つなぎっぱなしの通知（新しいコメントは、届いた瞬間に出る） ----
  //  つながっている間は、Vぶいへの「生きてるよ」の連絡は30秒に1回だけ。つながらない時は、前と同じく2秒ごとに聞きに行く
  let rtOK = false;
  function realtime() {
    try {
      if (!window.supabase?.createClient) return;
      const cl = window.supabase.createClient(SB, PK, { auth: { persistSession: false, autoRefreshToken: false } });
      cl.channel("ovl:" + KEY, { config: { broadcast: { self: false } } })
        .on("broadcast", { event: "items" }, (m) => handleItems(m.payload?.items))
        .on("broadcast", { event: "settings" }, (m) => handleSettings(m.payload?.settings, m.payload?.settings_at))
        // 配信者が出入り禁止にした人のコメントは、画面からすぐ消す
        .on("broadcast", { event: "dress" }, (m) => { try { dressApply(m.payload?.equip); } catch {} })
        .on("broadcast", { event: "dress_gift" }, (m) => { try { dressGift(m.payload || {}); } catch {} })
        .on("broadcast", { event: "remove" }, (m) => { (m.payload?.ids || []).forEach((id) => { seen.add(id); document.querySelectorAll(`.cm[data-id="${Number(id)}"]`).forEach((el) => el.remove()); }); })
        .subscribe((status) => { const was = rtOK; rtOK = status === "SUBSCRIBED"; if (was && !rtOK) kick(); });
    } catch { rtOK = false; }
  }

  let timer = null;
  function kick() { clearTimeout(timer); timer = setTimeout(poll, 300); }
  async function poll() {
    clearTimeout(timer);
    try {
      const r = await fetch(SB + "/functions/v1/overlay", { method: "POST", headers: { apikey: PK, Authorization: "Bearer " + PK, "Content-Type": "application/json" },
        // after: 最初の1回は0（今あるコメントは出さない）。2回目からは、それより新しいものを受け取る（-1 = 最初はコメントが1つもなかった）
        body: JSON.stringify({ action: "poll", key: KEY, after: started ? (after || -1) : 0, onecomme: onecomme === true, ack }) });
      const d = await r.json();
      if (d.error === "bad_key") { err("Vぶい：このURLは使えなくなりました。Vぶいの設定画面から新しいURLをコピーしてください"); timer = setTimeout(poll, 30000); return; }
      if (!r.ok) throw new Error(d.error);
      err(""); failCount = 0;
      if (!started) { started = true; after = Math.max(after, d.last || 0); } // 最初の1回：これより前のコメントは出さない
      handleSettings(d.settings, d.settings_at);
      handleItems(d.items); // 通知を取りこぼした時の、念のための受け取り
    } catch { if (++failCount > 5) err("Vぶい：通信できません。インターネットの接続を確認してください"); }
    timer = setTimeout(poll, rtOK ? 30000 : 2000);
  }
  applySettings();
  if (!DEMO) { realtime(); ocInit().then(poll); dressLoad(); setInterval(dressLoad, 60e3); }
  // わんコメが起動しているかを10秒ごとに確かめる
  //  ・閉じた → Vぶいのコメントは、この画面のすみっこに自動で出す
  //  ・また起動した → すみっこのコメントはすっと消して、また わんコメ（YouTubeのコメント）に混ぜて出す
  async function ocWatch() {
    if (!OC || S.oc === "no") return;
    const was = onecomme;
    try {
      const r = await fetch(OC_URL + "/api/services", { cache: "no-store" });
      const list = await r.json(); const arr = Array.isArray(list) ? list : (list.services || list.data || []);
      if (!q.get("ocsvc")) ocService = arr[0]?.id || ocService;
      onecomme = !!ocService;
    } catch { onecomme = false; }
    if (was === false && onecomme === true) clearStack();
  }
  function clearStack() {
    document.querySelectorAll("#stack .cm").forEach((el) => { el.classList.add("out"); setTimeout(() => el.remove(), 600); });
  }
  setInterval(ocWatch, 10000);

  // Vぶいが演出画面を新しくしたら、自動で読み込み直す（OBSを再起動しなくてOK）
  //  5分ごとに自分のページを見に行って、中身が変わっていたら、演出が出ていない時に読み込み直す
  let selfText = null;
  async function selfCheck() {
    try {
      const t = await (await fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" })).text();
      if (selfText === null) { selfText = t; return; }
      if (t !== selfText && t.includes("Vぶい 演出画面")) {
        const busy = () => heroBusy || gBusy || document.querySelector("#fx .banner") || document.querySelector("#stack .cm");
        const go = () => { if (busy()) return setTimeout(go, 5000); location.reload(); };
        go();
      }
    } catch {}
  }
  selfCheck(); setInterval(selfCheck, 5 * 60000);
})();
</script>
