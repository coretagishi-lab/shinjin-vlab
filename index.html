<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F0E15">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Vぶい">
<link rel="icon" href="icon-192.png">
<style>html{-webkit-text-size-adjust:100%}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Vぶい｜新人VTuberを見つける場所</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="新人だって、ブイブイ言わせたい。見つけてもらえない個人勢の新人VTuberを、毎日自動で集めて紹介する名鑑。配信中・初配信予定・配信回数と合計時間がひと目でわかります。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Layout: one-screen phone app — scrolling main area + fixed bottom tab bar; profile opens as a full-screen sheet with a flippable trading card. */
:root{
  --bg:#F5F5F8; --surface:#FFFFFF; --ink:#1D1A2B; --muted:#6B6880; --line:#E4E2EC; --chip:#EBEAF1;
  --accent:#FFAE1A; --accent-ink:#3A2600; --live:#E5333D; --ok:#1F9D6B;
  --card-navy:#2B2340; --card-gold:#E9B84A;
  --f-display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"Chakra Petch","Zen Kaku Gothic New",ui-monospace,sans-serif;
  --nav-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F0E15; --surface:#1A1824; --ink:#F1EFF7; --muted:#9C98AE; --line:#2C2939; --chip:#25222F;
  --accent:#FFC24A; --accent-ink:#2A1B00; --live:#FF4A53; --ok:#3CC48F; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F0E15; --surface:#1A1824; --ink:#F1EFF7; --muted:#9C98AE; --line:#2C2939; --chip:#25222F;
  --accent:#FFC24A; --accent-ink:#2A1B00; --live:#FF4A53; --ok:#3CC48F; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
input{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}
.view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav-h) + 12px)}
.view[hidden]{display:none!important}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:10px}
.logo{font-family:var(--f-display);font-size:19px;letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.logo .mk{width:26px;height:26px;border-radius:7px;background:var(--card-navy);display:grid;place-items:center;color:var(--card-gold);font-size:14px}
.logo .lg{height:36px;width:auto;display:block}
.logo small{font-family:var(--f-num);font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.top .sp{flex:1}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.iconbtn svg{width:22px;height:22px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:2px 10px;position:sticky;top:56px;z-index:4;background:var(--bg)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:9px;background:var(--chip);font-weight:500;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip b{font-family:var(--f-num);margin-left:4px}

/* home feed (YouTube-like) */
.feed{display:flex;flex-direction:column;gap:18px}
.vid{display:block}
.thumb{display:block;position:relative;aspect-ratio:16/9;width:100%;max-width:100%;border-radius:12px;overflow:hidden;background:var(--chip)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ph + img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.disc-empty{min-height:100%;padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) calc(var(--nav-h) + 24px) max(16px,env(safe-area-inset-left,0px));color:#fff;background:#0F0E15}
.disc-empty h2{font-family:var(--f-display);font-size:20px;margin:0 0 6px}
.disc-empty p{color:#B8B4CC;margin:0 0 18px;font-size:13px}
.nx{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid #2A2738;cursor:pointer}
.nx .tb{position:relative;flex:0 0 128px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#222}
.nx .tb .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:26px;color:#fff}
.nx .tx{min-width:0;font-size:13px;line-height:1.45}
.nx .tx b{display:block;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nx .tx span{color:var(--accent);font-family:var(--f-num);font-size:12px}
.thumb{cursor:pointer}
.thumb iframe,.vbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;z-index:1}
.thumb .bdg{z-index:2}
.snd{position:absolute;right:8px;bottom:8px;z-index:3;background:rgba(0,0,0,.72);color:#fff;font-size:11.5px;font-weight:700;border-radius:14px;padding:4px 10px}
.snd[hidden]{display:none}
.snd{border:0;font:inherit;font-size:12px;font-weight:700;padding:7px 12px;border-radius:16px;cursor:pointer}
.watch{position:fixed;inset:0;z-index:40;background:#0F0E15;color:#fff;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px)}
.watch.open{transform:none}
.w-top{display:flex;align-items:center;gap:8px;padding-block:6px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.w-top .iconbtn{color:#fff}
.w-top .ttl{flex:1;min-width:0;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-player{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#000;flex:0 0 auto}
.w-player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.w-bar{display:flex;gap:8px;align-items:center;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
.w-bar::-webkit-scrollbar{display:none}
.w-bar .av{flex:0 0 36px;width:36px;height:36px}
.w-bar{flex-wrap:wrap;row-gap:8px}
.w-bar .who{display:flex;gap:10px;align-items:center;flex:1 0 100%;min-width:0}
.w-bar .nm{min-width:0;flex:1;font-size:13px;line-height:1.35}
.w-bar .acts{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1 0 100%}
.w-bar .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-bar .nm span{color:#B8B4CC;font-size:11.5px}
.wb{flex:0 0 auto;border:0;border-radius:18px;padding:8px 12px;font:inherit;font-size:12.5px;font-weight:700;background:#2A2738;color:#fff;display:inline-flex;gap:5px;align-items:center;text-decoration:none;cursor:pointer}
.wb.sub{background:#fff;color:#0F0E15}
.wb[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.w-chat{flex:1;min-height:0;position:relative;background:#fff;border-top:1px solid #2A2738}
.w-chat{overflow:hidden}
.w-chat iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.w-chat.crop iframe{height:calc(100% + 76px)}
#v-home,#v-discover{position:relative}
#discList{height:100%}
.pl{position:absolute;z-index:3;background:#000;overflow:hidden;pointer-events:none;transition:opacity .12s ease}
.pl-feed{border-radius:12px}
.pl-watch{z-index:2}
.pl.hush{opacity:0}
.pl.hush *{pointer-events:none!important}
.pl iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
.pl .pl-tap{position:absolute;inset:0;z-index:1;pointer-events:none}
.pl-watch .pl-tap{pointer-events:auto;touch-action:none}
.pl .pl-live{position:absolute;left:8px;bottom:8px;z-index:2;background:var(--live);color:#fff;font-family:var(--f-num);font-weight:700;font-size:11px;padding:2px 8px;border-radius:4px}
.pl-watch .pl-live,.pl:not([data-live="1"]) .pl-live{display:none}
.pl .pl-ctl{position:absolute;inset:0;z-index:2;display:grid;place-items:center;background:rgba(0,0,0,.28);pointer-events:none}
.pl .pl-ctl[hidden]{display:none}
.pl .pl-pp{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;cursor:pointer}
.pl .pl-pp svg{width:30px;height:30px}
.pl .pl-snd{position:absolute;right:8px;bottom:8px;z-index:3;pointer-events:auto;background:rgba(0,0,0,.72);color:#fff}
.pl-watch .pl-snd{display:none}
.pl-watch .pl-ctl{background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.18) 30%,rgba(0,0,0,.18) 70%,rgba(0,0,0,.55))}
.pl .pl-ib{position:absolute;pointer-events:auto;width:44px;height:44px;border:0;background:none;color:#fff;display:grid;place-items:center;cursor:pointer;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.pl .pl-ib svg{width:24px;height:24px}
.pl .pl-mute{right:52px;bottom:4px}
.pl .pl-fs{right:6px;bottom:4px}
.pl .pl-x{left:6px;top:4px;display:none}
.pl.fs .pl-x{display:grid}
.pl.fs{position:fixed!important;left:0!important;top:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;z-index:60;border-radius:0}
.pl.fs .pl-ib{width:52px;height:52px}
.pl.fs .pl-mute{right:64px;bottom:max(8px,env(safe-area-inset-bottom,0px))}
.pl.fs .pl-fs{right:max(10px,env(safe-area-inset-right,0px));bottom:max(8px,env(safe-area-inset-bottom,0px))}
@media (orientation:portrait){
  .pl.fs.fs-rot:not(.fs-locked){width:100vh!important;width:100dvh!important;height:100vw!important;left:100vw!important;transform-origin:0 0;transform:rotate(90deg)}
}
.w-off{flex:1;display:grid;place-items:center;text-align:center;color:#B8B4CC;font-size:13px;line-height:1.7;padding:24px}
.wtouch{position:absolute;inset:0;z-index:3;touch-action:none}
.wpause{position:absolute;inset:0;z-index:2;display:grid;place-items:center;pointer-events:none;font-size:46px;color:#fff;background:rgba(0,0,0,.35)}
.wpause[hidden]{display:none}
.watch.drag{transition:none}
.w-grab{width:38px;height:4px;border-radius:2px;background:#4A4660;margin:6px auto 0}
.wsnd[hidden]{display:none}
.w-note{flex:1;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));color:#B8B4CC;font-size:13px;line-height:1.7;overflow-y:auto}
.w-note b{color:#fff}
.w-cmt{flex:0 0 auto;display:block;text-align:center;text-decoration:none;font-weight:700;font-size:14px;background:var(--live);color:#fff;padding:13px 16px calc(13px + env(safe-area-inset-bottom,0px))}
.vbox{position:absolute;left:0;right:0;top:56px;aspect-ratio:16/9;max-width:100%;background:#000;overflow:hidden}
.slide .vbox .live-tag{top:8px;left:8px;transform:none;z-index:2}
.dchat{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:76px;top:calc(56px + 56.25vw + 12px);bottom:168px;border-radius:12px;overflow:hidden;background:#0F0E15;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 12%);mask-image:linear-gradient(180deg,transparent 0,#000 12%)}
.dchat iframe{position:absolute;left:0;top:-48px;width:125%;height:calc((100% + 120px) * 1.25);border:0;pointer-events:none;transform:scale(.8);transform-origin:0 0}
.dsnd{position:absolute;right:8px;bottom:8px;z-index:3;background:rgba(0,0,0,.72);color:#fff}
.dchat button{position:absolute;inset:0;background:transparent;border:0;cursor:pointer}
.dchat .lbl{position:absolute;right:8px;bottom:8px;z-index:2;font-size:11px;font-weight:700;background:rgba(0,0,0,.6);border-radius:10px;padding:3px 8px;pointer-events:none}
.vbox .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:60px}
.vbox img{width:100%;height:100%;object-fit:cover}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:42px;color:#fff}
.bdg{position:absolute;font-family:var(--f-num);font-weight:700;font-size:11px;padding:2px 6px;border-radius:4px;letter-spacing:.04em}
.bdg.live{left:8px;bottom:8px;background:var(--live);color:#fff}
.bdg.time{right:8px;bottom:8px;background:rgba(0,0,0,.78);color:#fff}
.bdg.debut{left:8px;top:8px;background:var(--card-navy);color:var(--card-gold)}
.bdg.first{right:8px;top:8px;background:var(--accent);color:var(--accent-ink)}
.meta{display:flex;gap:10px;padding-top:10px}
.av{flex:none;width:36px;height:36px;border-radius:50%;overflow:hidden;background:var(--chip);position:relative}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av .ph{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.meta .t{font-weight:700;font-size:14.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta .s{color:var(--muted);font-size:12.5px;margin-top:3px}
.meta>div{min-width:0}
.sos{display:flex;flex-direction:column;gap:8px;margin:4px 0 12px}
.sos-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--live)}
.sos-h i{width:8px;height:8px;border-radius:50%;background:var(--live);animation:sosb 1s infinite}
@keyframes sosb{50%{opacity:.25}}
.sos-c{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:color-mix(in srgb,var(--live) 10%,var(--surface));border:1.5px solid color-mix(in srgb,var(--live) 45%,transparent);border-radius:14px;padding:10px 12px}
.sos-c .av{width:44px;height:44px;border-radius:50%;overflow:hidden;position:relative;flex:none}
.sos-c .av .ph,.sos-c .av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:grid;place-items:center;color:#fff;font-weight:700}
.sos-c .bd{flex:1;min-width:0}
.sos-c b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sos-c span{font-size:12px;color:var(--muted)}
.sos-c .go{flex:none;background:var(--live);color:#fff;font-weight:700;font-size:12.5px;border-radius:999px;padding:7px 12px}
.ks{margin-top:12px;border-radius:14px;padding:12px 14px;background:linear-gradient(135deg,color-mix(in srgb,var(--card-gold) 30%,var(--surface)),var(--surface));border:1.5px solid color-mix(in srgb,var(--card-gold) 60%,transparent);display:flex;flex-direction:column;gap:6px}
.ks b{font-size:14.5px}
.ks span{font-size:12.5px;color:var(--muted)}
.ks .bd2{display:flex;gap:6px;flex-wrap:wrap}
.ks .bd2 em{font-style:normal;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--surface);border:1px solid var(--line)}
.ks button.shr{border:0;cursor:pointer;font:inherit;font-weight:700;font-size:12.5px}
.ks .shr{align-self:flex-start;background:#000;color:#fff;font-weight:700;font-size:12.5px;border-radius:999px;padding:7px 14px;text-decoration:none}
.ksl{display:flex;flex-direction:column;gap:10px}
.ksl .ks{margin-top:0}
.ksl .krow{display:flex;gap:10px;align-items:center}
.ksl .krow .av{width:40px;height:40px;border-radius:50%;overflow:hidden;position:relative;flex:none}
.ksl .krow .av .ph,.ksl .krow .av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:grid;place-items:center;color:#fff;font-weight:700}
.w-sos{margin:0 12px 8px;background:color-mix(in srgb,var(--live) 22%,#1A1824);border:1px solid var(--live);color:#fff;border-radius:12px;padding:8px 12px;font-size:12.5px;line-height:1.6}
.w-sos b{color:#FFB3B7}
.own .sosbtn{background:var(--live);color:#fff}
.own .sosbtn[disabled]{background:#4A4560;color:#B8B4CC}
.empty{padding:40px 8px;text-align:center;color:var(--muted);line-height:1.8}
.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.sec-h{font-weight:700;font-size:16px;margin:22px 0 10px;display:flex;align-items:baseline;gap:8px}
.sec-h span{font-size:12px;color:var(--muted);font-weight:500}

/* discover (shorts) */
#v-discover{padding:0;overflow-y:scroll;scroll-snap-type:y mandatory;padding-bottom:0}
#v-discover.noslides{scroll-snap-type:none;background:#0F0E15}
#v-discover.noslides #discList{height:auto}
.slide{height:calc(100% - var(--nav-h));scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;background:#14111f;color:#fff}
#v-discover .slide{height:calc(100% - var(--nav-h) - env(safe-area-inset-bottom,0px))}
.slide .bg{position:absolute;inset:-20%;background-size:cover;background-position:center;filter:blur(38px) saturate(1.2) brightness(.55)}
.slide .grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,8,20,.2) 0%,rgba(10,8,20,.1) 40%,rgba(10,8,20,.85) 100%)}
.slide .hd{position:absolute;top:0;left:0;right:0;height:56px;box-sizing:border-box;text-align:center;padding-top:10px;font-weight:700;font-size:15px}
.slide .hd small{display:block;font-weight:500;font-size:11px;opacity:.75;margin-top:2px}
.slide .big{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:min(56vw,230px);aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:0 0 0 4px rgba(255,255,255,.12),0 18px 50px rgba(0,0,0,.5)}
.slide .big img{width:100%;height:100%;object-fit:cover}
.slide .big .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:72px}
.slide .info{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:76px;bottom:16px}
.slide.has-chat .nm{font-size:18px;margin:6px 0 4px}
.slide.has-chat .next{display:none}
.slide.has-chat .go{margin-top:8px}
.slide.has-chat .info{right:16px}
.slide.has-chat .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slide.has-chat .rail{flex-direction:row;gap:10px;bottom:16px;right:max(14px,env(safe-area-inset-right,0px));font-size:0}
.slide.has-chat .rail .ic{width:40px;height:40px}
.slide.has-chat .dchat{right:max(12px,env(safe-area-inset-right,0px));bottom:150px}
.slide.vert .vbox{bottom:150px;aspect-ratio:auto;height:auto}
.slide.vert .dchat{top:auto;height:34%;bottom:156px;left:10px;right:60px;background:transparent}
.slide.vert .dchat iframe{opacity:.72}
.w-player.vert{aspect-ratio:9/16;max-height:58vh;width:auto;margin:0 auto}
.slide .no{display:inline-block;font-family:var(--f-num);font-weight:700;font-size:11px;background:var(--card-gold);color:#2a1b00;border-radius:4px;padding:1px 7px}
.slide .nm{font-family:var(--f-display);font-size:22px;margin:8px 0 6px;line-height:1.25;word-break:break-word}
.slide .st{display:flex;gap:14px;font-size:12.5px;opacity:.92;flex-wrap:wrap}
.slide .st b{font-family:var(--f-num);font-size:15px;margin-right:2px}
.slide .next{margin-top:8px;font-size:12.5px;color:#ffd98a}

let homeIO = null;
const stopPlayer = () => HP?.stop();
function watchHome() {
  homeIO?.disconnect();
  if (!live) { HP?.stop(); return; }
  if (!HP) HP = new Player("feed");
  HP.host($("#v-home"));
  const ratios = new Map(); let cur = null;
  homeIO = new IntersectionObserver((ents) => {
    ents.forEach((e) => ratios.set(e.target, e.intersectionRatio));
    let best = null, br = 0.75;
    ratios.forEach((r, el) => { if (r > br + 0.01 || (r >= br && !best)) { best = el; br = r; } });
    if (best && best !== cur) { cur = best; if (!watchVid) HP.play(best, best.dataset.vid, true); else HP.target = best; }
    else if (!best && cur && (ratios.get(cur) ?? 0) < 0.4) { cur = null; HP.stop(); }
  }, { root: $("#v-home"), threshold: [0, .4, .75, 1] });
  const ts = document.querySelectorAll("#feed .thumb[data-emb]");
  if (!ts.length) HP.stop();
  ts.forEach((t) => homeIO.observe(t));
}

const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isStandalone = navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
const isIOSApp = isIOS && isStandalone;
function openExt(url) {
  // iPhoneのホーム画面アプリからは、白い画面を挟まずYouTubeアプリを直接開く
  if (isIOSApp) {
    const appUrl = url.replace(/^https:\/\/(www\.)?youtube\.com\//, "youtube://www.youtube.com/");
    let left = false; const onHide = () => { left = true; };
    document.addEventListener("visibilitychange", onHide, { once: true });
    location.href = appUrl;
    setTimeout(() => { document.removeEventListener("visibilitychange", onHide); if (!left && document.visibilityState === "visible") window.open(url, "_blank"); }, 1400);
    return;
  }
  window.open(url, "_blank", "noopener");
}
let watchVid = null;
(() => {
  let y0 = null, x0 = 0, dy = 0, t0 = 0, fsMode = false, rot = false;
  const w = () => $("#watch");
  document.addEventListener("touchstart", (e) => {
    if (!e.target.closest(".w-top, .w-grab, #wBar .who") && !e.target.closest("#wPlayer .pl-tap")) return;
    if (!watchVid) return;
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; dy = 0; t0 = Date.now();
    fsMode = !!WP?.fs; rot = fsMode && WP.el.classList.contains("fs-rot") && !WP.el.classList.contains("fs-locked") && matchMedia("(orientation: portrait)").matches;
    if (!fsMode) w().classList.add("drag");
  }, { passive: true });
  document.addEventListener("touchmove", (e) => {
    if (y0 == null) return;
    const sx = e.touches[0].clientX - x0, sy = e.touches[0].clientY - y0;
    // 全画面で90度回している時は、画面の「下」が端末の左方向になる
    const down = rot ? -sx : sy, side = Math.abs(rot ? sy : sx);
    dy = Math.max(0, down);
    if (side > dy && dy < 20) { dy = 0; return; }
    if (fsMode) WP.el.style.opacity = String(Math.max(.4, 1 - dy / 400));
    else w().style.transform = dy ? `translateY(${dy}px)` : "";
  }, { passive: true });
  document.addEventListener("touchend", () => {
    if (y0 == null) return;
    const moved = dy, dt = Date.now() - t0; y0 = null;
    const swiped = moved > 90 || (moved > 40 && dt < 250);
    if (fsMode) { WP.el.style.opacity = ""; if (swiped) WP.exitFs(); return; }
    const el = w(); el.classList.remove("drag"); el.style.transform = "";
    if (swiped) return closeWatch();
  });
})();

async function logout() {

async function authInit() {
  if (!AUTH) { authReady = true; return; }
  const q = new URLSearchParams(location.search), claim = q.get("claim"), reg = q.get("reg");
  if (q.get("role") === "vtuber") myRole = "vtuber";
  const { data } = await AUTH.auth.getSession(); SESSION = data.session;
  AUTH.auth.onAuthStateChange((_e, s) => { if (s) SESSION = s; });
  if (claim || reg) try { history.replaceState({}, "", location.pathname); } catch {}
  if (!SESSION) { authReady = true; if (tab === "my") renderMy(); return; }
  authBusy = true; if (tab === "my") renderMy();
  try {
    if (claim) {
      if (!SESSION.provider_token) ownMsg = "Googleからの確認情報が届きませんでした。いったんログアウトして、もう一度お試しください。";
      else {
        const r = await ownerApi({ action: "claim", provider_token: SESSION.provider_token });
        if (r.error === "no_channel") ownMsg = "このGoogleアカウントにはYouTubeチャンネルがありませんでした。配信しているチャンネルのアカウントでログインしてください。";
        else if (r.error === "no_scope") ownMsg = "YouTubeの表示を許可してもらえなかったため、確認できませんでした。もう一度押して、Googleの画面で「YouTube アカウントの表示」にチェックを入れたまま進んでください。";
        else if (r.error) ownMsg = "うまく確認できませんでした。もう一度お試しください。（" + (r.detail || r.error) + "）";
        else {
          const taken = (r.results || []).some((x) => x.result === "taken"), added = (r.results || []).some((x) => x.result === "added");
          ownMsg = taken ? "このチャンネルは、すでに別のアカウントで登録されています。お心当たりがない場合は公式Xまでご連絡ください。" : added ? "本人登録が完了しました🎉 チャンネルの情報を取り込んで、名鑑に登録しました。" : "本人登録が完了しました🎉";
          myRole = "vtuber"; store.set("myRole", "vtuber");
        }
      }
    }
    const { data: p } = await AUTH.from("profiles").select("*").maybeSingle(); PROFILE = p || null;
    await refreshMine();
    if (PROFILE) { await oshiLoad(); await oshiMigrate(); if (MINE.length) await collabLoad(); }
  } catch (e) { ownMsg = "通信に失敗しました。"; }
  authBusy = false; authReady = true;
  if (SESSION && !PROFILE) openNick();
  pushInit(); navBadge();
  if (tab === "my") renderMy(); else if (curId) renderProfile(); else if (typeof refreshCurrent === "function") refreshCurrent();
}

const greetFor = (me, accepted) => accepted

function collabBox() {

    ${other?.x_handle ? `<span>Xで連絡を取りましょう：<a href="https://x.com/${encodeURIComponent(other.x_handle)}" target="_blank" rel="noopener">@${esc(other.x_handle)}</a></span>

/* ---------- 通知 ---------- */
const VAPID_PUB = "BJrS7id_cQ0OmCJaesYBF9vVtk2uuH_PKylZvA1EBDf7bri49x35kbUg3A1K_64cQKnVY8FAK3EqOl-noudAGMM";
const pushOK = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
let pushSub = null, pushBusy = false;
const b64u = (s) => { const p = "=".repeat((4 - s.length % 4) % 4); const r = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from([...r].map((c) => c.charCodeAt(0))); };
async function pushApi(body) {
  const r = await fetch(`${SB_URL}/functions/v1/push`, { method: "POST", headers: { apikey: SB_KEY, Authorization: `Bearer ${SESSION?.access_token || SB_KEY}`, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return r.json();
}
async function pushInit() {
  if (!pushOK) return;
  try { const reg = await navigator.serviceWorker.register("sw.js"); pushSub = await reg.pushManager.getSubscription(); if (pushSub && loggedIn()) pushApi({ action: "subscribe", subscription: pushSub.toJSON() }).catch(() => {}); } catch {}
  if (tab === "my") renderMy();
}
function pushBox() {
  const box = (b, s, x = "") => `<div class="ks" style="border-color:var(--line);background:var(--surface)"><b>${b}</b><span>${s}</span>${x}</div>`;
  if (!pushOK) return isIOS && !isStandalone ? box("🔔 推しの救援を通知で受け取る", "iPhoneは、Vぶいを<b>ホーム画面に追加</b>すると通知が使えます。Safariで開いて「共有」→「ホーム画面に追加」→ ホーム画面のVぶいから開いて、ここでオンにしてください。") : box("🔔 通知", "このブラウザは通知に対応していません。");
  if (Notification.permission === "denied") return box("🔔 通知がブロックされています", "ブラウザ（またはスマホ）の設定で、Vぶいの通知を「許可」にしてから、もう一度開いてください。");
  const vt = MINE.length ? "・コラボ申請" : "";
  if (!pushSub) return box("🔔 推しの救援を通知で受け取る", `推しリストの子が救援要請を出したら、スマホに通知が届きます${vt ? "（コラボ申請も届きます）" : ""}。★最推しは必ず、ほかの推しは1日3件までお知らせします。`, `<button class="shr" data-push="on" ${pushBusy ? "disabled" : ""}>${pushBusy ? "設定中…" : "通知をオンにする"}</button>`);
  return `<div class="ks"><b>🔔 通知オン</b><span>推し${favs.size}人の救援${vt}をお知らせします（★最推し${tops.size}人は必ず、ほかは1日3件まで）。</span><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="shr" data-push="test">テスト通知を送る</button><button class="shr gray" data-push="off">通知をオフ</button></div></div>`;
}
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-push]"); if (!b) return;
  const k = b.dataset.push;
  if (!needLogin("通知")) return;
  try {
    if (k === "on") {
      pushBusy = true; renderMy();
      const perm = await Notification.requestPermission();
      if (perm !== "granted") { pushBusy = false; renderMy(); return toast("通知が許可されませんでした"); }
      const reg = await navigator.serviceWorker.register("sw.js"); await navigator.serviceWorker.ready;
      pushSub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(VAPID_PUB) });
      const r = await pushApi({ action: "subscribe", subscription: pushSub.toJSON() });
      pushBusy = false; renderMy(); toast(r.ok ? "🔔 通知をオンにしました" : "うまく設定できませんでした");
    } else if (k === "test") {
      b.textContent = "送信中…"; const r = await pushApi({ action: "test", subscription: pushSub.toJSON() });
      b.textContent = "テスト通知を送る"; toast(r.ok ? "テスト通知を送りました" : "送れませんでした。いったんオフにして、もう一度オンにしてください");
    } else if (k === "off") {
      await pushApi({ action: "unsubscribe", subscription: pushSub.toJSON() }).catch(() => {});
      await pushSub.unsubscribe().catch(() => {}); pushSub = null; renderMy(); toast("通知をオフにしました");
    }
  } catch (err) { pushBusy = false; renderMy(); toast("通知の設定に失敗しました"); }
});

function streamsOf(id) { return ST.filter((s) => s.channel_id === id); }
function spark(id) {
  const pts = DAILY.filter((d) => d.channel_id === id && d.subscriber_count != null).sort((a, b) => a.day < b.day ? -1 : 1);
  if (pts.length < 2) return `<p style="opacity:.75">登録者数は${pts[0] ? jst(pts[0].day + "T12:00:00+09:00", { month: "numeric", day: "numeric" }) : "今日"}から毎日記録しています。2日分たまるとグラフになります。</p>`;
  const W = 280, H = 70, P = 6, ys = pts.map((p) => Number(p.subscriber_count)), mn = Math.min(...ys), mx = Math.max(...ys), span = Math.max(1, mx - mn);
  const xy = pts.map((p, i) => [P + i * (W - 2 * P) / (pts.length - 1), H - P - (Number(p.subscriber_count) - mn) / span * (H - 2 * P)]);
  const line = xy.map((q, i) => (i ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1)).join(" ");
  const last = xy[xy.length - 1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="登録者数の推移"><path d="${line} L${last[0]} ${H} L${P} ${H}Z" fill="rgba(233,184,74,.18)"/><path d="${line}" fill="none" stroke="#E9B84A" stroke-width="2"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="#E9B84A"/></svg>

        <div class="hd"><span class="grade">NORMAL</span><span class="no">${noStr(c)}</span>${L ? `<span class="lv">LIVE</span>` : ""}</div>
        <div class="art">${img(c.thumbnail_url, c)}<span class="shine"></span></div>
        <div class="nmrow"><div class="nm">${esc(c.title)}</div><div class="sub">${d ? `DEBUT DAY ${d}` : "COMING SOON"}${c.handle ? `・${esc(c.handle)}` : ""}</div></div>
        <div class="stats"><div><b>${fmtSubs(c)}</b><span>登録者</span></div><div><b>${c.stream_count}</b><span>配信回数</span></div><div><b>${hours(c.total_stream_sec)}</b><span>合計時間</span></div></div>
        <div class="ft"><span>今月 ${c.viewers_month}人が見た</span><span class="tap">TAP ▸</span></div>
      </div></div>
      <div class="face back"><div class="inner">
        <div class="bhd"><span class="mk">V</span><span class="bt">Vぶい</span><span class="bno">${noStr(c)}</span></div>
        <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" data-btab="${k}" aria-selected="${backTab === k}">${l}</button>`).join("")}</div>
        <div class="pane" id="pane">${backPane(c)}</div>
        <div class="bft"><span>VV BUIBUI</span><span>NORMAL・${noStr(c)}</span></div>
      </div></div>
    </div></div>
    <div class="flipnote">タップか横スワイプでめくれます</div>
    <div class="cta">
      <a class="btn red" href="${L ? ytWatch(L.id) : n ? ytWatch(n.id) : ytChan(c.id)}" target="_blank" rel="noopener" data-watch="${esc(c.id)}"${(L || n) && (L || n).embeddable !== false && live ? ` data-wv="${esc((L || n).id)}" data-cid="${esc(c.id)}"` : ""}><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>${L ? "配信を見る" : n ? "配信予約を見る" : "チャンネルへ"}</a>
      <a class="btn plain" href="${ytChan(c.id)}?sub_confirmation=1" target="_blank" rel="noopener" data-sub="${esc(c.id)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>チャンネル登録</a>
      <button class="btn plain wide" data-fav="${esc(c.id)}" aria-pressed="${favs.has(c.id)}">${favs.has(c.id) ? "推しリストに入っています" : "推しリストに入れる"}</button>
      ${favs.has(c.id) ? `<button class="btn plain wide topbtn" data-top="${esc(c.id)}" aria-pressed="${tops.has(c.id)}">${tops.has(c.id) ? "★ 最推しです（救援を優先してお知らせ）" : `☆ 最推しにする（あと${3 - tops.size}人）`}</button>` : ""}
    </div>
    ${kosanBox(c)}
    ${n ? `<div class="views">次の配信 <b>${md(n.scheduled_start_at)} ${hm(n.scheduled_start_at)}</b>（${rel(n.scheduled_start_at)}）</div>` : ""}
    ${near.length ? `<div class="sec-h">いま配信中・同じ時期にデビューした子<span>${near.length}人</span></div><div class="hscroll">${near.map((x) => miniCard(x, true)).join("")}</div>` : ""}
    <div class="cta"><button class="btn gold wide" data-go="discover">次の新人を発掘する</button></div>`;
  cardSet(cardAngle, false);
}

/* ---------- カードのめくり（角度で管理して、逆回転しないようにする） ---------- */
let cardAngle = 0;
function cardSet(a, anim = true) {
  const t = $("#tcard"); cardAngle = a; if (!t) return;
  t.style.transition = anim ? "" : "none"; t.style.transform = `rotateX(0deg) rotateY(${a}deg)`;
  t.classList.toggle("flip", Math.abs(Math.round(a / 180)) % 2 === 1);
}
function cardFlip(dir) { cardSet(Math.round(cardAngle / 180) * 180 + 180 * (dir < 0 ? -1 : 1)); }
(() => {
  let x0 = 0, y0 = 0, t0 = 0, dx = 0, dy = 0, dir = "", card = null, swiped = 0;
  document.addEventListener("touchstart", (e) => {
    card = e.target.closest("#tcard"); if (!card || e.touches.length > 1) { card = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now(); dx = dy = 0; dir = "";
  }, { passive: true });
  document.addEventListener("touchmove", (e) => {
    if (!card) return;
    dx = e.touches[0].clientX - x0; dy = e.touches[0].clientY - y0;
    if (!dir) { if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.2) dir = "h"; else if (Math.abs(dy) > 8) dir = "v"; }
    if (dir !== "h") return;
    const tilt = Math.max(-8, Math.min(8, -dy * 0.08));
    card.style.transition = "none"; card.style.transform = `rotateX(${tilt}deg) rotateY(${cardAngle + dx * 0.55}deg)`;
  }, { passive: true });
  const end = () => {
    if (!card) return;
    if (dir === "h") {
      const v = Math.abs(dx) / Math.max(1, Date.now() - t0);
      if (Math.abs(dx) > 45 || v > 0.45) cardFlip(dx); else cardSet(cardAngle);
      swiped = Date.now();
    }
    card = null; dir = "";
  };
  document.addEventListener("touchend", end); document.addEventListener("touchcancel", end);
  document.addEventListener("click", (e) => { if (Date.now() - swiped < 450 && e.target.closest("#tcard")) { e.stopPropagation(); e.preventDefault(); } }, true);
})();

/* ---------- TABS ---------- */
let tab = "home";
function setTab(t) {
  tab = t;
  document.querySelectorAll(".view").forEach((v) => (v.hidden = v.id !== "v-" + t));
  document.querySelectorAll(".nav button").forEach((b) => b.dataset.tab === t ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  document.body.classList.toggle("dark-nav", t === "discover");
  if (t !== "home") HP?.stop();
  if (t !== "discover") DP?.stop();
  if (t !== "discover") document.querySelectorAll("#v-discover .dchat iframe").forEach((f) => f.remove());
  store.set("tab", t);
  refreshCurrent();
}
function refreshCurrent() {
  if (tab === "home") renderHome();
  else if (tab === "discover") { if (!$("#v-discover .slide")) renderDiscover(); else $("#v-discover").querySelectorAll("[data-fav]").forEach((b) => b.setAttribute("aria-pressed", favs.has(b.dataset.fav))); }
  else if (tab === "dir") setDirSeg(dirSeg);
  else if (tab === "sched") renderSched();
  else if (tab === "my") { renderMy(); if (authReady && viewAs() === "guest" && !isAdmin()) openJoin(null); }
}

document.addEventListener("click", (e) => {
  if (curId && e.target.matches("#sheet, #shBody, .sh-top, .cta, .hscroll, .flipnote, .views, .sec-h")) return closeProfile();
  if (curId && e.target.matches(".stage")) { const r = $("#tcard")?.getBoundingClientRect(); if (r && (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom)) return closeProfile(); return; }
  if (e.target.closest("#wClose")) return closeWatch();

  const th = e.target.closest(".thumb[data-url]");
  if (th) {
    logEvent("click_watch", th.dataset.cid);
    if (th.dataset.canembed && live) return openWatch(th.dataset.vid);
    return openExt(th.dataset.url);
  }
  const wv = e.target.closest("[data-wv]");
  if (wv) { e.preventDefault(); logEvent("click_watch", wv.dataset.cid); return openWatch(wv.dataset.wv); }
  const ext = e.target.closest('a[target="_blank"]');
  if (ext && /youtube\.com/.test(ext.href) && isIOSApp) { e.preventDefault(); setTimeout(() => openExt(ext.href), 0); }
  const t = e.target.closest("[data-tab],[data-mode],[data-sort],[data-open],[data-fav],[data-go],[data-btab],[data-watch],[data-sub],#back,#share,#tcard");
  if (!t) return;
  if (t.dataset.tab) return setTab(t.dataset.tab);
  if (t.dataset.mode) { homeMode = t.dataset.mode; renderHome(); $("#v-home").scrollTop = 0; return; }
  if (t.dataset.sort) { sortMode = t.dataset.sort; renderDir(); return; }
  if (t.dataset.btab) { e.stopPropagation(); backTab = t.dataset.btab; const c = byId.get(curId); $("#pane").innerHTML = backPane(c); document.querySelectorAll("[data-btab]").forEach((b) => b.setAttribute("aria-selected", b.dataset.btab === backTab)); return; }
  if (t.dataset.watch) { logEvent("click_watch", t.dataset.watch); return; }
  if (t.dataset.sub) { logEvent("click_subscribe", t.dataset.sub); return; }
  if (t.dataset.open) { e.preventDefault(); return openProfile(t.dataset.open); }
  if (t.dataset.fav) { e.preventDefault(); oshiToggle(t.dataset.fav); return; }
  if (t.dataset.go) { if (curId) closeProfile(); return setTab(t.dataset.go); }
  if (t.id === "back") return closeProfile();
  if (t.id === "tcard") { if (e.target.closest("a,button,[data-btab],input")) return; cardFlip(1); return; }
  if (t.id === "share") {
    const url = `${location.origin}${location.pathname}?c=${encodeURIComponent(curId)}`;
    navigator.clipboard?.writeText(url).then(() => toast("リンクをコピーしました"), () => toast(url));
  }
});
document.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.id === "tcard") { e.preventDefault(); cardFlip(1); }
  if (e.key === "Escape" && curId) closeProfile();
});
$("#q").addEventListener("input", renderDir);
addEventListener("popstate", () => {
  const q = new URLSearchParams(location.search), w = q.get("w"), id = q.get("c");
  if (w) { if (watchVid !== w) openWatch(w, false); } else if (watchVid) closeWatch(true);
  if (id) { if (curId !== id) openProfile(id, false); } else if (curId) closeProfile(true);
});

load().then(() => {
  const qt = new URLSearchParams(location.search).get("tab"); const saved = qt || store.get("tab", "home");
  setTab(["home", "discover", "dir", "sched", "my"].includes(saved) ? saved : "home");
  const id = new URLSearchParams(location.search).get("c");
  if (id && byId.has(id)) openProfile(id, false);
  const wq = new URLSearchParams(location.search).get("w");
  if (wq) openWatch(wq, false);
  authInit();
  setInterval(() => { if (tab === "home" && !curId && !HP?.target) renderHome(); }, 60000);
  setInterval(async () => { if (!live) return; try { const s = await rest("streams?select=id,channel_id,title,thumbnail_url,status,scheduled_start_at,actual_start_at,actual_end_at,peak_viewers,last_viewers,is_first_stream,embeddable,is_vertical,chat_enabled&status=neq.none&order=updated_at.desc&limit=3000"); ST = s.filter((x) => byId.has(x.channel_id) && x.embeddable !== false); if (tab !== "discover") discOrder = null; } catch {} }, 5 * 60000);
});
})();
</script>
