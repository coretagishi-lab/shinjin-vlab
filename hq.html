<style>

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14131A; --surface:#1E1C26; --ink:#EEEAF4; --muted:#A39DB2; --line:#302D3B; --chip:#2A2734;

body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.75 var(--f);-webkit-text-size-adjust:100%}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px}
header{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}

nav.tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;background:var(--bg);padding-block:10px;margin-top:10px;border-bottom:1px solid var(--line)}

nav.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}

.cmp>div{padding:8px 6px;border-bottom:1px solid var(--line)}
.cmp .h{font-size:12px;color:var(--muted);font-weight:700}
.cmp .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.soon{border:1.5px dashed var(--line);border-radius:14px;padding:14px;margin-top:10px}

.gate{text-align:center;padding:60px 10px}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB_URL = "https://sgmzyhvhwbqyudayboes.supabase.co";
const SB_KEY = "sb_publishable_igtK18JrLPQCoKbF0U03Gg_o8fKrApc";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n, d = 0) => n == null || !isFinite(n) ? "—" : Number(n).toLocaleString("ja-JP", { maximumFractionDigits: d, minimumFractionDigits: d });
const med = (a) => { const b = a.filter((x) => x != null && isFinite(x)).sort((x, y) => x - y); if (!b.length) return null; const m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; };
const avg = (a) => { const b = a.filter((x) => x != null && isFinite(x)); return b.length ? b.reduce((s, x) => s + x, 0) / b.length : null; };
const jstHour = (t) => (new Date(t).getUTCHours() + 9) % 24;
const jstDay = (t) => new Date(Date.parse(t) + 9 * 3600e3).getUTCDay();
const DAYS = ["日", "月", "火", "水", "木", "金", "土"];
// 順位どうしの関係の強さ（-1〜+1）。多い子ほど伸びているなら＋
function rankCorr(xs, ys) {
  const p = xs.map((x, i) => [x, ys[i]]).filter(([x, y]) => x != null && y != null && isFinite(x) && isFinite(y));
  if (p.length < 8) return null;
  const rk = (v) => { const o = v.map((x, i) => [x, i]).sort((a, b) => a[0] - b[0]); const r = new Array(v.length); for (let i = 0; i < o.length;) { let k = i; while (k + 1 < o.length && o[k + 1][0] === o[i][0]) k++; for (let m = i; m <= k; m++) r[o[m][1]] = (i + k) / 2; i = k + 1; } return r; };
  const a = rk(p.map((q) => q[0])), b = rk(p.map((q) => q[1])), ma = avg(a), mb = avg(b);
  let s = 0, sa = 0, sbb = 0; for (let i = 0; i < a.length; i++) { s += (a[i] - ma) * (b[i] - mb); sa += (a[i] - ma) ** 2; sbb += (b[i] - mb) ** 2; }
  return sa && sbb ? s / Math.sqrt(sa * sbb) : null;
}

/* ---------- グラフ（ぜんぶ日本語の言葉で） ---------- */
// rows: {label, value, n, hi}  base: 基準線（1倍など）
function hbars(rows, { unit = "", digits = 1, base = null, max = null, nLabel = "件" } = {}) {
  if (!rows.length) return `<p class="note">まだデータが足りません</p>`;
  const mx = max ?? (Math.max(...rows.map((r) => r.value || 0), base || 0) * 1.05 || 1);
  return `<div class="hb">${rows.map((r) => `<div class="r"><span class="l" title="${esc(r.label)}">${esc(r.label)}</span><span class="t"><i class="${r.hi ? "hi" : ""}" style="width:${Math.max(0, (r.value || 0) / mx * 100)}%"></i>${base != null ? `<span class="base" style="left:${base / mx * 100}%"></span>` : ""}</span><span class="v">${fmt(r.value, digits)}${unit}${r.n != null ? `<small>${fmt(r.n)}${nLabel}</small>` : ""}</span></div>`).join("")}</div>`;
}
function vbars(rows, { unit = "", digits = 1 } = {}) {
  const mx = Math.max(...rows.map((r) => r.value || 0)) || 1;
  return `<div class="vb">${rows.map((r) => `<div class="c" title="${esc(r.label)}：${fmt(r.value, digits)}${unit}（${fmt(r.n)}件）"><em>${r.value == null ? "" : fmt(r.value, digits)}</em><i class="${r.hi ? "hi" : ""}" style="height:${r.value == null ? 0 : Math.max(2, r.value / mx * 120)}px"></i><span>${esc(r.label)}</span></div>`).join("")}</div>`;
}
const hiTop = (rows, k = 1) => { const s = [...rows].filter((r) => r.value != null).sort((a, b) => b.value - a.value).slice(0, k); s.forEach((r) => (r.hi = true)); return rows; };

/* ---------- ジャンル・ゲームの見分け方（タイトルの言葉から） ---------- */
const GAMES = [
  ["APEX", /apex|エーペックス|えぺ/i], ["VALORANT", /valorant|ヴァロ|ばろらんと/i], ["マインクラフト", /マイクラ|minecraft|マインクラフト/i],
  ["ポケモン", /ポケモン|pokemon|ポケポケ/i], ["スプラトゥーン", /スプラ|splatoon/i], ["モンハン", /モンハン|モンスターハンター|monster ?hunter/i],
  ["フォートナイト", /フォートナイト|fortnite/i], ["原神", /原神|genshin/i], ["崩壊スターレイル", /スターレイル|スタレ/i], ["ストリートファイター6", /スト6|ストリートファイター|sf6/i],
  ["マリオカート", /マリカ|マリオカート/i], ["スマブラ", /スマブラ/i], ["麻雀（雀魂など）", /雀魂|麻雀|じゃんたま|mahjong/i], ["8番出口", /8番出口/i],
  ["Among Us", /among ?us|アモアス/i], ["ARK", /\bark\b|アーク/i], ["エルデンリング", /エルデン|elden/i], ["ウマ娘", /ウマ娘/i], ["学園アイドルマスター", /学マス|学園アイドルマスター/i],
  ["ブルーアーカイブ", /ブルアカ|ブルーアーカイブ/i], ["プロセカ", /プロセカ|プロジェクトセカイ/i], ["ゼルダ", /ゼルダ/i], ["どうぶつの森", /あつ森|どうぶつの森/i],
  ["桃太郎電鉄", /桃鉄/i], ["ファイナルファンタジー", /ff14|ff7|ff16|ファイナルファンタジー/i], ["ドラゴンクエスト", /ドラクエ|ドラゴンクエスト/i],
  ["ホラーゲーム", /ホラー|horror|心霊/i], ["Lethal Company", /lethal|リーサル/i], ["Overwatch", /overwatch|オーバーウォッチ/i], ["League of Legends", /\blol\b|league of legends/i],
  ["Escape from Tarkov", /タルコフ|tarkov/i], ["PUBG", /pubg/i], ["ストグラ・GTA", /ストグラ|gta/i], ["Rust", /\brust\b/i], ["パルワールド", /パルワールド|palworld/i],
];
const KINDS = [
  ["雑談", /雑談|freetalk|free talk|おしゃべり|ざつだん/i], ["歌枠", /歌枠|歌う|うたわく|karaoke|singing|歌ってみ/i], ["ゲーム実況", null],
  ["ASMR", /asmr|囁き|ささやき|耳かき/i], ["お絵描き", /お絵描き|お絵かき|drawing|イラスト/i], ["朝活", /朝活|おはよう|morning/i], ["作業・勉強", /作業|勉強|study/i],
  ["凸待ち", /凸待ち/i], ["参加型", /参加型|視聴者参加|リスナー参加/i], ["コラボ", /コラボ|collab|ｺﾗﾎﾞ/i], ["耐久", /耐久/i], ["初配信", /初配信|デビュー配信/i],
  ["占い・相談", /占い|タロット|相談/i], ["料理", /料理|cooking/i], ["Vtuber紹介・自己紹介", /自己紹介|はじめまして/i],
];
const WORDS = [
  ["「初見歓迎」と書く", /初見歓迎|初見さん歓迎|初見さんいらっしゃい/i], ["「【】」でくくる", /【.+】/], ["「耐久」", /耐久/], ["「コラボ」", /コラボ/i], ["「初配信」", /初配信/],
  ["「参加型」", /参加型/], ["「雑談」", /雑談/], ["「歌枠」", /歌枠/], ["「ASMR」", /asmr/i], ["絵文字を入れる", /\p{Extended_Pictographic}/u], ["「#」タグを入れる", /#\S/],
  ["「新人Vtuber」「新人」", /新人/i], ["「Vtuber」と書く", /vtuber/i], ["「凸待ち」", /凸待ち/], ["「〇〇まで」目標つき", /(人|名)(いくまで|まで)|目指して|行くまで/],
];
const gameOf = (t) => GAMES.filter(([, re]) => re.test(t || "")).map(([n]) => n);
const kindOf = (t) => { const k = KINDS.filter(([, re]) => re && re.test(t || "")).map(([n]) => n); if (gameOf(t).length) k.push("ゲーム実況"); return k; };

/* ---------- データの下ごしらえ ---------- */
let D = null, A = null;
function prep(d) {
  const now = Date.now();
  const ch = new Map(d.channels.map((c) => [c.id, { ...c, streams: [] }]));
  // 配信：長さと「その子のふだんと比べて何倍見られたか」
  const S = [];
  for (const s of d.streams) {
    const c = ch.get(s.channel_id); if (!c) continue;
    const st = Date.parse(s.actual_start_at), en = s.actual_end_at ? Date.parse(s.actual_end_at) : null;
    const dur = en ? (en - st) / 60000 : null;
    if (dur != null && (dur < 3 || dur > 24 * 60)) continue;
    const x = { ...s, st, dur, hour: jstHour(s.actual_start_at), dow: jstDay(s.actual_start_at), games: gameOf(s.title), kinds: kindOf(s.title),
      views: s.view_count != null && s.view_count >= 0 ? s.view_count : null, peak: s.peak_viewers || null,
      lead: s.scheduled_start_at ? (st - Date.parse(s.scheduled_start_at)) / 60000 : null };
    S.push(x); c.streams.push(x);
  }
  // 「ふだん」＝その子の配信の再生数の真ん中の値。比べるのはその子の中だけ（人気の差を消すため）
  for (const c of ch.values()) {
    c.streams.sort((a, b) => a.st - b.st);
    const ended = c.streams.filter((s) => s.dur != null);
    const mv = med(ended.map((s) => s.views)), mp = med(ended.map((s) => s.peak));
    for (const s of ended) { s.rel = mv && s.views != null && ended.filter((x) => x.views != null).length >= 4 ? s.views / mv : null; s.relPeak = mp && s.peak && ended.filter((x) => x.peak).length >= 4 ? s.peak / mp : null; }
    // 伸びの速さ：初配信からの1か月あたりの登録者の増え方
    const fs = c.first_stream_at ? Date.parse(c.first_stream_at) : ended[0]?.st;
    const days = fs ? (now - fs) / 864e5 : null;
    c.days = days;
    c.growth = !c.subscriber_hidden && c.subscriber_count != null && days >= 14 ? c.subscriber_count / Math.max(days, 30) * 30 : null;
    // ふるまい（記録がある期間）
    if (ended.length >= 3) {
      const span = Math.max(7, (ended[ended.length - 1].st - ended[0].st) / 864e5 + 1);
      c.perWeek = ended.length / span * 7;
      c.avgMin = avg(ended.map((s) => s.dur));
      c.weekHours = c.perWeek * c.avgMin / 60;
      c.night = ended.filter((s) => s.hour >= 19 || s.hour < 1).length / ended.length;
      const hs = ended.map((s) => (s.hour + 18) % 24); const mh = avg(hs);
      c.hourSpread = Math.sqrt(avg(hs.map((h) => (h - mh) ** 2)));
      let gap = 0; for (let i = 1; i < ended.length; i++) gap = Math.max(gap, (ended[i].st - ended[i - 1].st) / 864e5);
      c.maxGap = gap;
      c.scheduledRate = ended.filter((s) => s.lead != null && s.lead > 5).length / ended.length;
      c.collabRate = ended.filter((s) => /コラボ/i.test(s.title || "")).length / ended.length;
      c.gameRate = ended.filter((s) => s.games.length).length / ended.length;
    }
  }
  // 直近7日の登録者の増え方
  const byCh = new Map();
  for (const r of d.daily) { if (!byCh.has(r.channel_id)) byCh.set(r.channel_id, []); byCh.get(r.channel_id).push(r); }
  for (const [id, rows] of byCh) { const c = ch.get(id); if (!c) continue; rows.sort((a, b) => a.day < b.day ? -1 : 1); const last = rows[rows.length - 1], first = rows.find((r) => Date.parse(r.day) >= Date.parse(last.day) - 7 * 864e5) || rows[0]; if (rows.length >= 2 && last.subscriber_count != null && first.subscriber_count != null) { c.week = last.subscriber_count - first.subscriber_count; c.weekDays = Math.round((Date.parse(last.day) - Date.parse(first.day)) / 864e5); } }
  // Vぶいの記録
  for (const e of d.events) { const c = ch.get(e.channel_id); if (!c) continue; c.ev = c.ev || {}; c.ev[e.kind] = (c.ev[e.kind] || 0) + 1; }
  for (const o of d.oshi) { const c = ch.get(o.channel_id); if (c) { c.oshi = (c.oshi || 0) + 1; if (o.is_top) c.top = (c.top || 0) + 1; } }
  for (const v of d.vbc) { const c = ch.get(v.channel_id); if (c) c.vbc = (c.vbc || 0) + 1; }
  const C = [...ch.values()];
  return { C, S, ended: S.filter((s) => s.dur != null) };
}

/* ---------- 各ページ ---------- */
const TABS = [
  ["grow", "伸びる子の共通点"], ["length", "配信の長さ・回数"], ["time", "時間帯・曜日"], ["genre", "ゲーム・ジャンル"],
  ["title", "タイトル・告知"], ["first", "デビュー直後"], ["vv", "Vぶいの効果"], ["list", "VTuber一覧"], ["next", "これから集めるデータ"],
];
let tab = "grow";
try { tab = localStorage.getItem("hqTab") || "grow"; } catch {}

function summary() {
  const { C, ended } = A;
  const withGrowth = C.filter((c) => c.growth != null).length;
  const first = Math.min(...ended.map((s) => s.st)), withViews = ended.filter((s) => s.views != null).length;
  return `<div class="sum">

  const ev = (k) => C.reduce((a, c) => a + (c.ev?.[k] || 0), 0);
  const top = C.filter((c) => c.ev || c.oshi || c.vbc).sort((a, b) => ((b.ev?.click_watch || 0) + (b.oshi || 0) * 3) - ((a.ev?.click_watch || 0) + (a.oshi || 0) * 3)).slice(0, 20);
  return `<section class="card"><h2>Vぶいから、どれだけ人を送れている？</h2>
    <div class="sum"><div><b>${fmt(ev("impression"))}</b><span>発掘で表示された回数</span></div><div><b>${fmt(ev("click_watch"))}</b><span>配信を見に行った回数</span></div><div><b>${fmt(ev("click_subscribe"))}</b><span>チャンネル登録ボタンを押した回数</span></div><div><b>${fmt(C.reduce((a, c) => a + (c.oshi || 0), 0))}</b><span>推しリストに入った数</span></div><div><b>${fmt(C.reduce((a, c) => a + (c.vbc || 0), 0))}</b><span>Vぶいからのコメント</span></div></div>
    <h3>Vぶいから人が多く行っている子</h3>
    ${top.length ? `<div class="tw"><table><tr><th>VTuber</th><th>見に行った</th><th>登録ボタン</th><th>推し</th><th>Vぶいコメント</th><th>直近7日の登録者</th></tr>${top.map((c) => `<tr><td class="nm">${esc(c.title)}</td><td class="n">${fmt(c.ev?.click_watch || 0)}</td><td class="n">${fmt(c.ev?.click_subscribe || 0)}</td><td class="n">${fmt(c.oshi || 0)}</td><td class="n">${fmt(c.vbc || 0)}</td><td class="n">${c.week != null ? (c.week >= 0 ? "＋" : "") + fmt(c.week) + "人" : "—"}</td></tr>`).join("")}</table></div>` : `<p class="note">まだデータがありません</p>`}
    <h3>本人登録した子としていない子</h3>
    <div class="cmp" style="grid-template-columns:1fr auto auto"><div class="h">　</div><div class="h n">本人登録した子（${reg.length}人）</div><div class="h n">していない子（${not.length}人）</div>
      <div>直近7日の登録者の増え方（真ん中の値）</div><div class="n">${fmt(med(reg.map((c) => c.week)))}人</div><div class="n">${fmt(med(not.map((c) => c.week)))}人</div></div>
    <p class="note">本人登録した子がまだ少ないので、比べられるのは勧誘が進んでからです。</p>
  </section>`;
}
let lsort = "growth";
function pageList() {
  const cols = [["title", "VTuber"], ["subscriber_count", "登録者"], ["growth", "伸びの速さ（人/月）"], ["week", "直近7日"], ["perWeek", "週の配信"], ["avgMin", "1回の長さ（分）"], ["weekHours", "週の合計（時間）"], ["maxGap", "最長の休み（日）"], ["days", "デビューから（日）"]];
  const rows = [...A.C].filter((c) => c.streams.length).sort((a, b) => lsort === "title" ? String(a.title).localeCompare(b.title) : (b[lsort] ?? -1e9) - (a[lsort] ?? -1e9));
  return `<section class="card"><h2>VTuber一覧</h2><p class="lead">見出しを押すと並べかえられます。</p>
    <div class="tw"><table><tr>${cols.map(([k, l]) => `<th data-ls="${k}">${l}${lsort === k ? " ▼" : ""}</th>`).join("")}</tr>
    ${rows.slice(0, 300).map((c) => `<tr><td class="nm"><img src="${esc(c.custom_icon_url || c.thumbnail_url || "")}" alt="" loading="lazy">${esc(c.title)}${c.registered ? " ✓" : ""}</td><td class="n">${c.subscriber_hidden ? "非公開" : fmt(c.subscriber_count)}</td><td class="n">${fmt(c.growth)}</td><td class="n ${c.week > 0 ? "up" : ""}">${c.week != null ? (c.week > 0 ? "＋" : "") + fmt(c.week) : "—"}</td><td class="n">${fmt(c.perWeek, 1)}</td><td class="n">${fmt(c.avgMin)}</td><td class="n">${fmt(c.weekHours, 1)}</td><td class="n">${fmt(c.maxGap)}</td><td class="n">${fmt(c.days)}</td></tr>`).join("")}</table></div></section>`;
}
function pageNext() {
  return `<section class="card"><h2>これから集めるデータ（準備中）</h2>
    <p class="lead">いまのデータは「配信の時間・長さ・再生数・登録者」まで。リスナー1人ひとりの動きは、YouTubeのチャット（コメント）を記録すると分かるようになります。</p>
    <div class="soon"><b>YouTubeのチャットを記録すると分かること</b><ul>
      <li>リスナーが配信に入ってから、最初にスパチャ（投げ銭）するまで何分か（※YouTubeは「入った時間」を教えてくれないので、「最初にコメントした時間」から数えます）</li>
      <li>1回の配信でのスパチャの合計・平均・何人が投げたか</li>
      <li>1人のリスナーが何人のVTuberを見て回っているか（コメントした枠の数で数えます）</li>
      <li>1日に何分くらい見ているか（最初と最後のコメントの時間から目安を出します）</li>
      <li>初見さん（その子に初めてコメントした人）がどれくらい来たか・その後も来てくれたか</li>
      <li>何のゲーム・何時の配信で、スパチャや初見さんが増えるか</li>
    </ul></div>
    <div class="soon"><b>Vぶいに入った後の動き</b><ul>
      <li>Vぶいにログインしたリスナーの、その後の滞在時間・見に行った配信の数</li>
      <li>Vぶいに入る前と後で、スパチャの金額が増えたか（※リスナーがVぶいでYouTubeアカウントとつないだ場合だけ分かります）</li>
    </ul></div>
    <p class="note">YouTubeのチャットを読むのは、YouTubeの1日の利用枠をたくさん使います（読むたびに5、1日の枠は10,000）。いまの枠のまま全部の配信を記録すると、配信を見つける仕組みが止まってしまうので、Googleに利用枠を増やす申請をするか、記録する配信をしぼる必要があります。</p>
  </section>`;
}

function render() {
  try { localStorage.setItem("hqTab", tab); } catch {}
  $("#tabs").innerHTML = TABS.map(([k, l]) => `<button data-tab="${k}" aria-pressed="${tab === k}">${l}</button>`).join("");
  const P = { grow: pageGrow, length: pageLength, time: pageTime, genre: pageGenre, title: pageTitle, first: pageFirst, vv: pageVV, list: pageList, next: pageNext }[tab] || pageGrow;
  $("#view").innerHTML = (tab === "grow" ? summary() : "") + P();
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-tab]"); if (t) { tab = t.dataset.tab; render(); scrollTo({ top: 0 }); return; }
  const m = e.target.closest("[data-met]"); if (m) { metric = m.dataset.met; try { localStorage.setItem("hqMetric", metric); } catch {} render(); return; }
  const g = e.target.closest("[data-gm]"); if (g) { gmode = g.dataset.gm; render(); return; }
  const l = e.target.closest("[data-ls]"); if (l) { lsort = l.dataset.ls; render(); }
});

(async () => {
  const gate = $("#gate");
  try {
    const sb = supabase.createClient(SB_URL, SB_KEY);
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { gate.innerHTML = `<p>運営アカウントでログインしてください。</p><a href="./?login=1">ログインする</a>`; return; }
    const r = await fetch(`${SB_URL}/functions/v1/hq`, { method: "POST", headers: { apikey: SB_KEY, Authorization: `Bearer ${session.access_token}`, "Content-Type": "application/json" }, body: JSON.stringify({ action: "data" }) });
    const d = await r.json();
    if (!d.ok) { gate.innerHTML = d.error === "not_admin" ? `<p>このページは運営だけが見られます。</p><a href="./">Vぶいへ戻る</a>` : `<p>読み込めませんでした（${esc(d.error || r.status)}）。</p>`; return; }
    D = d; A = prep(d);
    gate.hidden = true; $("#app").hidden = false; render();
  } catch (e) { gate.innerHTML = `<p>読み込めませんでした。通信を確かめて、もう一度開いてください。</p>`; console.error(e); }
})();
</script>
</body>
</html>
